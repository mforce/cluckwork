services:
  # Bundled application: the .NET API serves the JSON API and the SPA (wwwroot).
  app:
    build:
      context: ..
      dockerfile: src/Cluckwork.Api/Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # #143: the auth rate limiter takes the client IP from X-Forwarded-For only
      # when the request arrives from a trusted proxy — traefik, on the compose
      # network (docker's default address pool). Override if your network differs;
      # without a trusted proxy the limiter would key on traefik's IP and throttle
      # all users as one client.
      RateLimiting__TrustedProxies__0: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      # #144: pin host filtering to the public hostname traefik routes, so a
      # forged Host header is rejected (400). Loopback is always allowed, so the
      # container healthcheck (Host: localhost) keeps working. HSTS + CSP + the
      # other security headers are emitted automatically outside Development.
      AllowedHosts: ${CLUCKWORK_HOST}
    depends_on:
      db:
        condition: service_healthy
      # #263 — the schema is migrated by the one-shot `migrate` job below (run
      # under the owner credential), not at request time. app serves with
      # Database:MigrateOnStartup=false (Production appsettings default), so a
      # least-privilege runtime role needs no DDL grant.
      migrate:
        condition: service_completed_successfully
    # Direct local access at http://localhost:8080 (SPA + API), independent of
    # traefik. Bound to loopback only — never exposes the plaintext API to the
    # LAN. In prod, front with traefik/TLS (the 'prod' profile) instead.
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.cluckwork.rule=Host(`${CLUCKWORK_HOST}`)
      - traefik.http.routers.cluckwork.entrypoints=websecure
      - traefik.http.routers.cluckwork.tls=true
      - traefik.http.services.cluckwork.loadbalancer.server.port=8080
    # NOTE: traefik discovers this by container label, not the service name —
    # the rename to `app` needs no label changes.

  # #263 — one-shot pre-deploy migration job: applies EF migrations (schema DDL)
  # then exits. The serving `app` waits for it (service_completed_successfully)
  # and runs with Database:MigrateOnStartup=false, so request-serving never runs
  # DDL. Here both use the single POSTGRES_USER; a real multi-role deploy points
  # THIS job at the owner/migrator credential and `app` at a least-privilege
  # runtime role (USAGE + DML, no DDL) — see AGENTS.md. `migrate` is a
  # run-then-exit verb on the same image (ENTRYPOINT dotnet Cluckwork.Api.dll).
  migrate:
    build:
      context: ..
      dockerfile: src/Cluckwork.Api/Dockerfile
    env_file:
      - .env
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - cluckwork-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    # Prod-only TLS/host router. Local dev hits the API directly on :8080, so
    # traefik does not start with a bare `docker compose up`. Enable in prod
    # with `docker compose --profile prod up`.
    profiles: ["prod"]
    image: traefik:v3.5
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dynamic:ro

volumes:
  cluckwork-postgres:
