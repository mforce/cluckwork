services:
  # Bundled application: the .NET API serves the JSON API and the SPA (wwwroot).
  #
  # EXACTLY ONE serving instance — no `deploy.replicas`, no second app service,
  # no scaling this on a real host. Every instance runs the DurableJobWorker
  # loop and its three recurring sweeps with nothing claiming the work, so a
  # second one double-runs them (#271); the step-up grant registry is
  # process-local, so a single-use grant becomes usable once per replica and a
  # logout is invisible to the others (#338); and the per-IP login limiter is
  # in-process, so N replicas allow ~N times the intended attempts (#143).
  #
  # Only the two purge sweeps are silent about it. DailyEntryLockSweep loses an
  # optimistic-concurrency check and logs "Lock sweep failed for account …",
  # which reads as a database fault rather than as a second replica. See
  # "Deploy invariant" in AGENTS.md — and note that #307's closure is NOT
  # permission to scale.
  app:
    build:
      context: ..
      dockerfile: src/Cluckwork.Api/Dockerfile
    env_file:
      - .env
    environment:
      # ASPNETCORE_ENVIRONMENT is intentionally UNSET → defaults to Production →
      # loads appsettings.Production.json (Database:MigrateOnStartup=false), so the
      # serving process never runs DDL (#263). Setting it to Development here would
      # silently re-enable boot-migration under the runtime credential — don't.
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # #262: this reference stack runs Production against a co-located Postgres over the
      # private compose bridge with no TLS, so the Production TLS floor would refuse to
      # boot. Opt out explicitly: plaintext over the internal bridge is acceptable HERE
      # (single host, db never published). A real deploy uses managed/TLS Postgres
      # (sslmode=Require min, VerifyFull+CA preferred) and NEVER sets this flag.
      Database__AllowInsecureConnection: "true"
      # #143: the auth rate limiter takes the client IP from X-Forwarded-For only
      # when the request arrives from a trusted proxy — traefik, on the compose
      # network (docker's default address pool). Override if your network differs;
      # without a trusted proxy the limiter would key on traefik's IP and throttle
      # all users as one client.
      RateLimiting__TrustedProxies__0: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      # #144: pin host filtering to the public hostname traefik routes, so a
      # forged Host header is rejected (400). Loopback is always allowed, so the
      # container healthcheck (Host: localhost) keeps working. HSTS + CSP + the
      # other security headers are emitted automatically outside Development.
      AllowedHosts: ${CLUCKWORK_HOST}
    # #266 — readiness probe. The image already carries this HEALTHCHECK; declared
    # here too so the stack's health is explicit and tunable. Runs the same
    # `healthcheck` verb inside the container (no curl/wget on the hardened image,
    # #267): exits non-zero until /health/ready is green (DB up + migrations
    # applied), so `docker compose` reports the app unhealthy until it can serve.
    healthcheck:
      test: ["CMD", "dotnet", "Cluckwork.Api.dll", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      # #263 — the schema is migrated by the one-shot `migrate` job below (run
      # under the owner credential), not at request time. app serves with
      # Database:MigrateOnStartup=false (Production appsettings default), so a
      # least-privilege runtime role needs no DDL grant.
      migrate:
        condition: service_completed_successfully
    # Direct local access at http://localhost:8080 (SPA + API), independent of
    # traefik. Bound to loopback only — never exposes the plaintext API to the
    # LAN. In prod, front with traefik/TLS (the 'prod' profile) instead.
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - traefik.enable=true
      - traefik.http.routers.cluckwork.rule=Host(`${CLUCKWORK_HOST}`)
      - traefik.http.routers.cluckwork.entrypoints=websecure
      - traefik.http.routers.cluckwork.tls=true
      - traefik.http.services.cluckwork.loadbalancer.server.port=8080
    # NOTE: traefik discovers this by container label, not the service name —
    # the rename to `app` needs no label changes.

  # #263 — one-shot pre-deploy migration job: applies EF migrations (schema DDL)
  # then exits. The serving `app` waits for it (service_completed_successfully)
  # and runs with Database:MigrateOnStartup=false, so request-serving never runs
  # DDL. Here both use the single POSTGRES_USER; a real multi-role deploy points
  # THIS job at the owner/migrator credential and `app` at a least-privilege
  # runtime role (USAGE + DML, no DDL) — see AGENTS.md. `migrate` is a
  # run-then-exit verb on the same image (ENTRYPOINT dotnet Cluckwork.Api.dll).
  migrate:
    build:
      context: ..
      dockerfile: src/Cluckwork.Api/Dockerfile
    env_file:
      - .env
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      # #262: same as `app` — the migrate job also connects Production/plaintext over the
      # private bridge, so it too opts out of the TLS floor for this reference stack.
      Database__AllowInsecureConnection: "true"
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.4-trixie@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    env_file:
      - .env
    volumes:
      - cluckwork-postgres-pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  traefik:
    # Prod-only TLS/host router. Local dev hits the API directly on :8080, so
    # traefik does not start with a bare `docker compose up`. Enable in prod
    # with `docker compose --profile prod up`.
    profiles: ["prod"]
    # #369 — pinned by IMMUTABLE DIGEST, same as `db` above, and bumped v3.5 →
    # v3.7.10. `v3.5` was a *release-branch* tag, which upstream silently stops
    # moving once attention shifts to the next minor: it resolved to v3.5.6
    # (2025-11-07) and scanned 57 fixable HIGH/CRITICAL, including a CRITICAL Go
    # stdlib CVE. v3.7.10 scans 0. That mattered beyond this file — the deploy
    # repo read its production Traefik version out of it.
    #
    # The tag is not the identity, and that is not theoretical: while this change
    # was being written, `v3.7.10` was re-pushed (2026-08-02 05:10 UTC) and the
    # SAME version string began resolving to different bytes. Both builds scan
    # clean; the digest below is the later one. Pinning the tag alone would have
    # silently swapped the image under a "no-op" edit.
    #
    # NOTE: a digest never floats, so it cannot drift — but it also cannot heal.
    # Nothing in this repo proposes a bump for it (Dependabot's `docker`
    # ecosystem reads Dockerfiles, not compose files) and nothing scans it, so
    # re-check this pin by hand when touching the deploy stack:
    #   docker buildx imagetools inspect traefik:v3.7
    #   trivy image --severity HIGH,CRITICAL --ignore-unfixed traefik:v3.7
    #
    # v3.7 vs v3.5, checked before bumping: `sanitizePath` has defaulted to true
    # since v3.3.6, and the v3.6.7 `http.encodedCharacters.*` knobs all default
    # to `true` (permissive) — so v3.7.10's DEFAULT path handling is identical to
    # v3.5.6's, and this stack's router rule is `Host(...)` only, with no path
    # matching and no path-rewriting middleware. Nothing here routes on the path,
    # so there is no traefik/app split view to open. Set the encodedCharacters
    # options to false only if you add path-based routing in front of a backend
    # that decodes encoded reserved characters.
    image: traefik:v3.7.10@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dynamic:ro

volumes:
  cluckwork-postgres-pg18:
