self-hosted-runner:
  # actionlint v1.7.12's bundled runner-label list predates the ubuntu-26.04
  # GA (2026-09-17, actions/runner-images#14747); these are GitHub-hosted
  # labels, not self-hosted runners, but this is the field actionlint uses to
  # extend its known-label set. The arm64 image leg in ci.yml now uses
  # ubuntu-26.04-arm. Keep both entries until a released actionlint knows
  # these labels natively. Drop this whole file once that
  # happens (rhysd/actionlint#682).
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm
