name: Third-party image pins
description: >-
  Enumerate the third-party container images pinned in deploy/, verify every one
  is pinned to an immutable digest, and emit them as a GitHub Actions matrix.

# #369 — used by BOTH ci.yml (does this PR pin something vulnerable?) and
# image-audit.yml (are the pins we already merged STILL clean?). Those answer
# different questions and neither substitutes for the other, but they enumerate
# the images identically — so the enumeration lives here once. A local composite
# action carries no supply-chain exposure: it is this repository's own tree,
# checked out by the caller, not a third-party action that needs a SHA pin.

outputs:
  matrix:
    description: JSON array of { ref, name, usedBy } — feed to fromJSON() as a matrix.
    value: ${{ steps.pins.outputs.matrix }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 26

    # `docker compose config` refuses to render when a service's `env_file:` is
    # missing, and deploy/.env is gitignored (it holds real values). The example
    # file is the committed stand-in; nothing here reads a VALUE out of it, only
    # the `image:` keys, which carry no interpolation.
    - name: Stage the example env so compose can render
      shell: bash
      run: |
        set -euo pipefail
        cp deploy/.env.example deploy/.env

    # --profile '*' is LOAD-BEARING. `traefik` sits behind `profiles: ["prod"]`,
    # and a render without it omits the service silently — the enumeration then
    # succeeds over a smaller set, leaving that pin unscanned while reporting
    # green. Verified: it exits 0 listing Postgres alone. The script cross-checks
    # it (every DECLARED profile must be carried by some rendered service), so
    # this is guarded rather than merely commented, but do not drop the flag.
    #
    # DISCOVERY is by content, not by filename (PR #379 review). An earlier
    # version globbed `deploy/docker-compose*.yml`, which silently covers nothing
    # named `compose.yml`, `stack.yml` or `docker-compose.foo.yaml` — a new file
    # could introduce an unpinned image and CI would stay green. Anything under
    # deploy/ that declares a top-level `services:` key is a compose file and is
    # rendered; a candidate that then fails to render is a hard error, never a
    # skip.
    - name: Render the compose files
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p /tmp/compose-render
        bundles=()
        while IFS= read -r src; do
          grep -qE '^services:' "$src" || continue
          out="/tmp/compose-render/$(printf '%s' "$src" | tr '/' '_').json"

          # Both halves come from compose, so neither is a hand-read of YAML.
          # `config --profiles` reports every profile the file DECLARES,
          # independently of which are enabled — that is what makes it able to
          # detect its own omission.
          docker compose --profile '*' -f "$src" config --format json > "$out.config"
          docker compose -f "$src" config --profiles > "$out.profiles"

          SRC="$src" node -e '
            const fs = require("fs");
            const out = process.argv[1];
            const profiles = fs.readFileSync(out + ".profiles", "utf8")
              .split("\n").map((s) => s.trim()).filter(Boolean);
            fs.writeFileSync(out, JSON.stringify({
              source: process.env.SRC,
              declaredProfiles: profiles,
              config: JSON.parse(fs.readFileSync(out + ".config", "utf8")),
            }));
          ' "$out"
          bundles+=("$out")
        done < <(find deploy -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)

        if [[ ${#bundles[@]} -eq 0 ]]; then
          echo "::error::no compose files found under deploy/. Either the layout moved or this" >&2
          echo "discovery is now covering nothing while reporting success — fix it, do not delete it." >&2
          exit 1
        fi
        printf '%s\n' "${bundles[@]}" > /tmp/compose-render/bundles.txt
        echo "Compose files discovered:"
        sed 's/^/  /' /tmp/compose-render/bundles.txt

    - name: Enumerate and verify the pins
      id: pins
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t bundles < /tmp/compose-render/bundles.txt
        matrix="$(node .github/scripts/compose-images.mjs --format matrix "${bundles[@]}")"
        printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
        printf 'Third-party images to scan:\n%s\n' \
          "$(printf '%s' "$matrix" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              for (const i of JSON.parse(s)) console.log(`  ${i.name}  (${i.usedBy})`);
            });')"
