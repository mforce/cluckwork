# SPA E2E smoke suite (#277 / #385 / #387).
#
# ================== WHEN THIS RUNS — AND WHY ==================
#
# The quick suite runs ON PULL REQUESTS (owner call, 2026-08-08, revising the
# original dispatch-only decision): #433 merged a deliberate session-contract
# change that broke this suite and nothing reported it for a day — the exact
# #370 rot the dispatch-only header used to warn about. The original cost
# estimate ("roughly 6-10 billed minutes") is also stale: the measured job is
# ~3 minutes wall (image build + boot + migrate + seed + 28 specs), which is
# in proportion to a PR gate. Path-filtered to changes the suite can actually
# see, and superseded runs are cancelled, so docs-only PRs and force-push
# churn cost nothing.
#
# workflow_dispatch remains for the modes a PR run never exercises — `slow`
# (the real 15-minute expiry spec) and `canary` — and for the k6 sibling the
# #370 warning still fully applies: nothing runs those for you.
#
# ================== THE SECOND BROWSER PATH ==================
#
# The suite resolves Chromium at run time (tools/simulation/ui/src/browser.ts).
# On the NixOS dev box it finds a SYSTEM chromium, because Playwright's
# downloaded binaries do not launch there. A GitHub runner is the mirror image:
# no system chromium, and `playwright install` is the working path.
#
# So there are two live paths, and **this workflow is the only thing that
# exercises the downloaded one** — routinely now, since every covered PR runs
# it. `CLUCKWORK_E2E_BUNDLED_BROWSER=1` below pins it explicitly rather than
# relying on the absence of a system binary, so the run proves the path on
# purpose instead of by accident.

name: E2E smoke

on:
  pull_request:
    # Only what the suite can observe: the app (image), the SPA it serves, the
    # harness that boots it, and this workflow itself. Docs/specs-only PRs
    # skip it. On pull_request the dispatch inputs below are empty, so the
    # slow and canary steps are off by construction.
    paths:
      - "src/**"
      - "web/**"
      - "tools/simulation/**"
      # Root-level image build inputs (codex review of #456): the Dockerfile
      # itself lives under src/ (covered above), but it COPYs these from the
      # repo root, and .dockerignore governs its whole build context.
      - "Directory.Build.props"
      - "Cluckwork.sln"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/e2e-smoke.yml"
  workflow_dispatch:
    inputs:
      slow:
        description: "Also run the real 15-minute token-expiry spec (adds ~16 min)"
        type: boolean
        default: false
      canary:
        # QUIET baseline only. The under-load probe needs k6, which needs the
        # pinned nix-shell this runner does not have — so `run-canary.sh
        # --with-load` is deliberately NOT what this input runs. Naming the mode
        # in the label so nobody dispatches this expecting the load measurement.
        description: "Also run the canary probe — QUIET baseline only, not the under-load run"
        type: boolean
        default: false

permissions:
  contents: read

# A force-push obsoletes the previous run's answer — stop paying for it.
concurrency:
  group: e2e-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: Playwright smoke over the simulation fixture
    runs-on: ubuntu-latest
    # PR runs are the ~3-minute quick suite with a headroom cap (a hung stack
    # must fail fast, not burn minutes). Dispatch stays generous because a
    # `slow: true` run spends 16 of these minutes asleep on purpose.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 45 }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/simulation/ui/package-lock.json

      # Generates .env.sim and .sim-cast.json — runtime secrets, git-ignored,
      # regenerated per run. No credential is ever committed or passed in.
      - name: Bootstrap the simulation harness config
        run: bash tools/simulation/bootstrap.sh

      # The self-check reset.sh runs anyway, hoisted so a config drift fails in
      # ~0.1s here instead of five minutes into an image build (#370).
      - name: Verify harness config
        run: bash tools/simulation/verify-harness.sh

      # Layer cache shared with ci.yml's image job — same key expression, so
      # whichever job built this commit first feeds the other, and a fresh
      # commit starts from the newest same-dependency cache via restore-keys.
      # Per-commit key suffix because actions/cache never re-saves an
      # exact-key hit — a content-only key would freeze at the first commit's
      # source layers (codex review of #456). A cold cache (first run, manual
      # dispatch on a fresh branch) just builds from scratch — nothing here is
      # required for the run to work.
      - name: Restore image layer cache
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: image-layers-${{ hashFiles('src/Cluckwork.Api/Dockerfile', '**/packages.lock.json', 'web/package-lock.json', 'Directory.Build.props', 'Cluckwork.sln', '.dockerignore') }}-${{ github.sha }}
          restore-keys: |
            image-layers-${{ hashFiles('src/Cluckwork.Api/Dockerfile', '**/packages.lock.json', 'web/package-lock.json', 'Directory.Build.props', 'Cluckwork.sln', '.dockerignore') }}-
            image-layers-

      # Pre-build the app image under the compose-derived tag (project
      # `cluckwork-sim`, service `app` → `cluckwork-sim-app:latest`), so
      # reset.sh's compose up can reuse it instead of rebuilding blind.
      - name: Pre-build the app image with the shared layer cache
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --name e2e-builder --use
          docker buildx build \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --load -f src/Cluckwork.Api/Dockerfile -t cluckwork-sim-app:latest .
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      # Boots the stack, migrates, bootstrap-admins, seeds the simulation
      # fixture, and verifies it. CLUCKWORK_SIM_REUSE_IMAGE=1 makes compose use
      # the image pre-built above (it still builds one itself if the tag were
      # absent); local/manual reset.sh runs keep the always-rebuild default.
      - name: Reset and seed the simulation stack
        env:
          CLUCKWORK_SIM_REUSE_IMAGE: "1"
        run: bash tools/simulation/reset.sh

      - name: Install suite dependencies
        working-directory: tools/simulation/ui
        # PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD is deliberately NOT set here — unlike
        # the NixOS dev box, the downloaded browser is the one that works.
        run: npm ci

      - name: Install Chromium
        working-directory: tools/simulation/ui
        run: npx playwright install --with-deps chromium

      - name: Run the smoke suite
        working-directory: tools/simulation/ui
        env:
          # Force the downloaded browser rather than inferring it from the
          # absence of a system one — see the header.
          CLUCKWORK_E2E_BUNDLED_BROWSER: "1"
          CLUCKWORK_E2E_SLOW: ${{ inputs.slow && '1' || '' }}
        run: npm test

      - name: Run the canary probe
        if: ${{ inputs.canary }}
        working-directory: tools/simulation/ui
        env:
          CLUCKWORK_E2E_BUNDLED_BROWSER: "1"
        # `run-canary.sh`, not `npm run canary` — the script owns clearing the
        # previous run's per-screen vitals. Calling the npm script directly
        # bypasses that and can mix stale screens into a fresh run's output
        # (PR #392 review round 2).
        run: bash run-canary.sh

      # DO NOT UPLOAD THE PLAYWRIGHT HTML REPORT. It is credential-bearing by
      # construction: Playwright embeds a base64 copy of the run's data inside
      # `index.html`, and the step titles it renders include the literal fill
      # values — so a sign-in step reads `Fill "<the password>"`. Deleting the
      # external trace `.zip`s does NOT remove that (PR #392 review round 2);
      # the credential simply rides in the HTML instead.
      #
      # This PR stack's original blocker was exactly this leak through the git
      # door. Uploading the report is the same leak through the artifact door,
      # and "strip the zips" was a fix that looked complete and was not.
      #
      # What is uploaded instead: screenshots and videos, which show the SPA's
      # rendered state (the password field is masked in the DOM) and carry no
      # request bodies. Everything else a red run needs — which spec failed, on
      # which assertion, with the error text — is already in the job log via the
      # `list` reporter, which is retained with the run and costs nothing.
      - name: Remove credential-bearing report artifacts
        if: always()
        run: |
          set -euo pipefail
          rm -rf tools/simulation/ui/playwright-report tools/simulation/ui/playwright-report-canary
          find tools/simulation/ui -type f \( -name '*.zip' -o -name 'error-context*' \) -delete

          # A REAL GATE, not a report. This step previously ended in `|| true`
          # and merely PRINTED what survived, while the upload below runs
          # `if: always()` and would have shipped it regardless.
          remaining="$(find tools/simulation/ui \( -name '*.zip' -o -name 'error-context*' -o -name 'index.html' -path '*report*' \))"
          if [ -n "$remaining" ]; then
            echo "::error::credential-bearing files survived stripping:"
            echo "$remaining"
            exit 1
          fi
          echo "strip verified: no report HTML, trace archives or error-context files remain"

      - name: Upload failure screenshots and video
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-media
          path: |
            tools/simulation/ui/test-results/**/*.png
            tools/simulation/ui/test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore

      # #487 — a Playwright failure here used to be undiagnosable from its own
      # artifacts, and by the time anyone noticed, the evidence was gone.
      #
      # THREE separate reasons the old `logs --tail 200` on failure was not
      # enough, all measured on #486's run:
      #
      #   * `--tail` is per RUN, not per service, and the app emits one compact
      #     JSON line per HTTP request (#404). 200 lines covered 01:01:00-01:01:19
      #     — the last 19 SECONDS — while the failing test ran 01:00:21-01:00:33.
      #     The relevant window had already scrolled off. The run is ~3 minutes,
      #     so per-service volume is bounded — for every service but one, see
      #     the collector measurement below.
      #   * Interleaved services put the app's lines out of reach even when they
      #     were present. Per-service, in collapsible groups, so the app log is
      #     one click rather than a scroll through Postgres chatter.
      #   * `if: failure()` kept NOTHING from a green run. Isolating #486 as
      #     timing rather than code meant comparing a red run against a green
      #     one, and that comparison was impossible — the green run had no logs
      #     at all. `if: always()` is most of this step's value.
      #
      # These logs are also the ANSWER to what a Playwright trace would have
      # been uploaded for. The trace's draw is its network log ("was the request
      # issued, and what did it return"), and the app's per-request JSON lines
      # carry that already. Traces are deliberately NOT uploaded: the strip step
      # above deletes them because they carry request bodies, and #392 closed
      # that leak on purpose. Do not reopen it to get diagnosability that is
      # already available here — see #487 for the decision.
      #
      # What the app log DOES carry, checked rather than assumed: 603 of 628
      # lines are `HTTP {RequestMethod} {RequestPath} responded {StatusCode}`,
      # which is method/path/status and no body. The db log is 60 lines and
      # carries one `STATEMENT:` — the expected pre-migration probe for
      # __EFMigrationsHistory. Residual, recorded so it is a known trade and not
      # an accident: Postgres includes bind parameters in the DETAIL of a
      # FAILING statement, so a failed Identity insert could put a password HASH
      # (never a plaintext password) in the job log. Accepted — the harness
      # credentials are generated per run by bootstrap.sh and die with the
      # stack.
      #
      # The one real credential printer is structurally excluded, and only by an
      # implementation detail: `bootstrap-admin` prints a freshly generated
      # temporary password to stdout (#283), but reset.sh runs it as
      # `compose run --rm app`, a separate one-off container that is gone before
      # this step executes — `compose logs app` reads the PERSISTENT service.
      # Fold those verbs into the long-lived container and this dump starts
      # carrying that password.
      #
      # The collector is the one stream NOT covered by SensitiveDataRedaction-
      # Enricher (the OTLP path is documented as unredacted). Under the current
      # config its spans carry no headers and no raw SQL — no
      # EnrichWithHttpRequest, no SetDbStatementForText — so the 200 capped
      # lines are safe today. Turn either of those on and this step publishes
      # them on every green run.
      #
      # Per-service volume is NOT uniform, which the first version of this step
      # got wrong. Measured on its own run: app 623 lines, db 60,
      # otel-collector 52075 — the collector's debug exporter echoes every span
      # and was 98.8% of the whole dump. Uncapped it re-creates, at the job-log
      # level, the same "the app's lines are out of reach" problem this step
      # exists to fix, and pushes a green run toward GitHub's log ceiling for no
      # diagnostic gain: the collector is a telemetry SINK, never the subject of
      # a Playwright failure. So app and db are dumped whole and the collector
      # is capped. 603 of those 623 app lines are
      # `HTTP {RequestMethod} {RequestPath} responded {StatusCode}` (#404), which
      # is the evidence a trace would have been uploaded for.
      #
      # Two review findings, both closed below rather than argued away:
      #
      #   * WORKFLOW-COMMAND INJECTION. Everything dumped here is application
      #     output, and a logged request path or error string containing
      #     `::endgroup::` would close the group early while `::error::` would
      #     forge an annotation. The anonymous /api/v1/client-errors report
      #     (#217) is the concrete caller-controlled route into this log.
      #
      #     NOT reachable today, and two reviewers disagreed about why, so it
      #     was MEASURED rather than argued. A probe step emitted
      #     `probe-1  | ::warning::X` and `::warning::Y` on a real run
      #     (f6793fe3, reverted in 81794277): exactly ONE annotation appeared,
      #     the unprefixed one. `docker compose logs` prefixes every line with
      #     the container name unless `--no-log-prefix` is passed, and GitHub
      #     parses a workflow command only at the START of a line — so the
      #     prefix is what blocks it.
      #
      #     The wrapper below is therefore belt-and-braces, NOT a fix for a live
      #     hole — do not let this comment claim otherwise. It is kept because
      #     the protection was an undocumented dependency on a docker-compose
      #     default, and "add --no-log-prefix, it reads better" is a plausible
      #     future edit that would silently reopen it. The token must be
      #     unpredictable: a fixed one could itself be emitted by the logs to
      #     turn parsing back on.
      #   * A HARDCODED SERVICE LIST GOES STALE. Naming the services by hand
      #     meant a service added to the compose file was silently absent, and a
      #     RENAMED one left a group that looks like it ran and is empty. The
      #     list is now derived from `docker compose config --services`, so new
      #     services are covered by construction — the same "walk everything,
      #     exclude deliberately" rule AGENTS.md applies to guards. Only the
      #     cap stays by name, which is a property of that one service.
      - name: Stack logs
        if: always()
        run: |
          set -euo pipefail
          compose() {
            docker compose -p cluckwork-sim \
              --env-file tools/simulation/.env.sim \
              -f tools/simulation/docker-compose.sim.yml "$@"
          }

          services="$(compose config --services 2>/dev/null | sort || true)"
          if [ -z "$services" ]; then
            echo "::warning::no compose services resolved — the stack config is unreadable, so this run has no logs to diagnose from"
            exit 0
          fi

          token="stop-$(openssl rand -hex 16)"
          for service in $services; do
            # Capped only for the collector — see the measurement above.
            case "$service" in
              otel-collector) tail_args="--tail 200" ;;
              *)              tail_args="" ;;
            esac
            echo "::group::docker logs — $service"
            echo "::stop-commands::${token}"
            # shellcheck disable=SC2086 # deliberate word-split: empty means no cap
            compose logs --no-color $tail_args "$service" || true
            echo "::${token}::"
            echo "::endgroup::"
          done
