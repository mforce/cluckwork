.tablewrap{overflow:auto;border:1px solid var(--rule);border-radius:var(--r-panel);background:var(--surface)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--rule);white-space:nowrap}th{font-size:12px;font-weight:600}tr.selected{background:var(--tint-accent)}.inspector{margin-top:16px;border:1px solid var(--rule);border-radius:var(--r-panel);padding:18px;background:var(--surface)}.facts{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0}.facts p{margin:0}.phone .facts{gap:12px 24px}.phone .tablewrap{margin-right:-16px;border-radius:0}.phone table{font-size:13px}.swipe{display:none}.phone .swipe{display:block;margin-top:8px}
.scrim{position:absolute;inset:0;padding:24px 16px;background:var(--scrim);display:flex;align-items:center;justify-content:center}.dlg{position:relative;width:min(480px,100%);background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-dialog);max-height:calc(100% - 48px);display:flex;flex-direction:column;overflow:hidden}.dlg-head{padding:24px 24px 16px;flex-shrink:0}.dlg h2{font:700 17px/24px var(--font);padding-right:28px;margin:0}.dlg .close{position:absolute;top:12px;right:12px;border:0;background:none;width:40px;height:40px;display:grid;place-items:center;color:var(--muted)}.dlg-content{padding:0 24px 20px;min-height:0;overflow-y:auto}.dlg-actions{padding:8px 24px 16px;display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-shrink:0}.dlg-actions .btn{min-width:0;flex:0 1 auto}.phone .dlg h2{font-size:17px;line-height:24px}.phone .dlg .field{margin-top:22px}

#frame.long .identity{font-size:14px}

.pk-required{padding:32px;min-height:800px}.pk-required-inner{max-width:760px;margin:auto}.phone .pk-required{padding:16px;min-height:844px}.phone .pk-proof .actions{gap:0;margin-top:8px}

<body>
<div class="lab" aria-label="Design lab controls">
<strong>Two-factor authentication · design lab</strong>
<label>Screen <select id="screen"></select></label>
<label>Direction <select id="direction"></select></label>
<label>State <select id="state"></select></label>
<label>Width <select id="width"><option>1280</option><option>390</option></select></label>
<label>Theme <select id="theme"><option value="light">Day</option><option value="dark">Night</option></select></label>
</div>
<p class="labnote" id="labnote"></p>
<div class="stage"><div id="frame"></div></div>
<script>
const TERMS = { twoFactor: 'two-factor authentication', authenticator: 'authenticator app', recovery: 'recovery code' };
const cap = value => value[0].toUpperCase() + value.slice(1);
const t = TERMS;
const SCREENS = {
  account: { name: '1 · Account security', recommended: 'a', directions: { a: 'A · Security accordion' }, states: ['off','setting-up','on','low','regenerate','regenerate-recovery','regenerate-daily','regenerate-daily-recovery','regenerate-daily-recovery-wrong','regenerate-limited','turn-off','turn-off-recovery','turn-off-daily','turn-off-daily-recovery','turn-off-daily-recovery-wrong','turn-off-limited','wrong','done'] },
  enrolment: { name: '2 · Enrolment', recommended: 'a', directions: { a: 'A · Scan and confirm together', b: 'B · Separate scan and confirm' }, states: ['scan','manual','confirm','wrong','expired'] },
  recovery: { name: '3 · Recovery codes', recommended: 'a', directions: { a: 'A · Save before leaving' }, states: ['new','copied','downloaded','saved','regenerated'] },
  login: { name: '4 · Login code', recommended: 'a', directions: { a: 'A · Existing Login B card' }, states: ['code','wrong','recovery','recovery-wrong','expired','limited','daily','daily-recovery','daily-recovery-wrong','connect','connect-recovery','connect-recovery-wrong','connect-password','password','connect-wrong','connect-expired','connect-limited','connect-daily','connect-daily-recovery','connect-daily-recovery-wrong','long'] },
  stepup: { name: '5 · Step-up', recommended: 'a-password', directions: { a: 'A1 · Superseded code-alone proof', 'a-password': 'A2 · Selected inline password plus code', b: 'B · Review then verify' }, states: ['dialog','verify','wrong','limited','daily','daily-recovery','daily-recovery-wrong','recovery','recovery-wrong','consent','consent-verify','consent-wrong','consent-limited','consent-daily','consent-daily-recovery','consent-daily-recovery-wrong','consent-recovery','consent-recovery-wrong'] },
  users: { name: '6 · Reset another user', recommended: 'a-password', directions: { a: 'A1 · Inspector layout, superseded proof', 'a-password': 'A2 · Selected password-plus-code reset' }, states: ['selected','confirm','wrong','limited','daily','daily-recovery','daily-recovery-wrong','recovery','recovery-wrong','done','self'] },
};
const REASONS = {
  account: 'A keeps status, the remaining codes and both actions inside the existing Account accordion pattern.',
  enrolment: 'A puts the code field beside the QR and key. B shortens each step but adds a page change.',
  recovery: 'A keeps every code visible and asks for an explicit saved confirmation before leaving.',
  login: 'A keeps the chosen Login B card and the connected app name throughout the second step.',
  stepup: 'Selected layout A keeps the action, target and identity proof together. Password plus code applies; A1 is superseded. B reduces field density but hides the draft while verifying.',
  users: 'A adds the reset to the existing selected-user inspector and names both the target and the acting account in the confirmation.',
};
let cfg = { screen: 'account', direction: 'a', state: 'off', width: 1280, theme: 'light' };
let saved = false;
let sampleState = 0x1275;
const SAMPLE_CODES = Array.from({ length: 10 }, () => {
  const alphabet = '23456789BCDFGHJKMNPQRTVWXY';
  const characters = Array.from({length:16}, () => {
    sampleState = (Math.imul(sampleState, 1664525) + 1013904223) >>> 0;
    return alphabet[Math.floor(sampleState / 2 ** 32 * alphabet.length)];
  }).join('');
  return Array.from({length:4}, (_,group) => characters.slice(group * 4, group * 4 + 4)).join('-');
});
const frame = document.querySelector('#frame');
const paths = { shield: '<path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6z"/><path d="m8 12 3 3 5-6"/>', alert: '<path d="m12 3 10 18H2z"/><path d="M12 9v5m0 3h.01"/>', close: '<path d="m6 6 12 12M18 6 6 18"/>', reset: '<path d="M3 11a9 9 0 1 1 2 7M3 4v7h7"/>', chevron: '<path d="m6 9 6 6 6-6"/>' };
const icon = name => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[name]}</svg>`;
const button = (label, action, style = '', disabled = false) => `<button class="btn ${style}" data-action="${action}" ${disabled ? 'disabled' : ''}>${label}</button>`;
const alert = (text, kind = 'error') => `<div class="alert ${kind}" role="${kind === 'error' ? 'alert' : 'status'}">${icon(kind === 'success' ? 'shield' : 'alert')}<p>${text}</p></div>`;
function field(label, id, { error = '', hint = '', password = false, disabled = false, recovery = false, autocomplete = password ? 'new-password' : 'one-time-code' } = {}) {
  return `<div class="field ${error ? 'error' : ''}"><label for="${id}">${label}</label><input id="${id}" name="${id}" type="${password ? 'password' : 'text'}" ${password ? `autocomplete="${autocomplete}"` : `autocomplete="one-time-code" ${recovery ? 'maxlength="19"' : 'inputmode="numeric" maxlength="6"'}`} ${error ? 'aria-invalid="true"' : ''} aria-describedby="${id}-hint" ${disabled ? 'disabled' : ''}><p id="${id}-hint" class="hint ${error ? 'error-text' : 'muted'}">${error || hint}</p></div>`;
}
function codeState() {
  const recovery=cfg.state.includes('recovery'), daily=cfg.state.includes('daily'), limited=cfg.state.endsWith('limited');
  return {recovery,daily,limited,wrong:cfg.state.endsWith('wrong'),blocked:limited || (daily && !recovery)};
}
const needsPassword = () => cfg.screen === 'account' || cfg.direction === 'a-password';
function proofInstruction(purpose) {
  const method = codeState().recovery ? `a ${t.recovery}` : `a code from your ${t.authenticator}`;
  return `Enter ${needsPassword() ? 'your password and ' : ''}${method} to ${purpose}.`;
}
function proofFields() {
  const {recovery,daily,limited,wrong,blocked} = codeState();
  const password = needsPassword() ? field('Your current password','proof-password',{password:true,autocomplete:'current-password',disabled:limited}) : '';
  const error = wrong ? (recovery ? `That ${t.recovery} did not work or has already been used.` : 'That code did not work. Try a new code.') + (cfg.screen === 'stepup' && cfg.state.startsWith('consent') ? ' Nothing was connected.' : '') : '';
  const input = field(recovery ? `Your ${t.recovery}` : 'Your authenticator code','proof-code',{
    recovery, error, disabled:blocked,
    hint:recovery ? '16 characters, with or without the hyphens.' : `Enter the 6-digit code from your ${t.authenticator}.`,
  });
  const notice = daily ? alert(recovery ? `The daily authenticator-code limit is reached. ${cap(t.recovery)}s can still be used.` : `The daily authenticator-code limit is reached. Use a ${t.recovery}, or wait until the daily limit resets.`,'warning')
    : limited ? alert('Too many requests from this address. Wait before trying again.','warning') : '';
  return `${password}${input}${notice}<div class="actions">${button(recovery ? 'Use an authenticator code' : `Use a ${t.recovery}`,recovery ? 'use-authenticator' : 'use-recovery','',limited)}</div>`;
}
const proof = (purpose = 'confirm this change') => `<div class="ruled"><h3>Confirm it's you</h3><p class="muted">${proofInstruction(purpose)}</p><p class="caption">Signed in as ana@example.test</p>${proofFields()}</div>`;
function accordion(title, body, open = false) { return `<details class="acc" ${open ? 'open' : ''}><summary>${title}${icon('chevron')}</summary><div class="accbody">${body}</div></details>`; }
function shell(body, page = 'Account') {
  return `<div class="app"><aside class="rail"><div class="farm">Cluckwork · Sunrise Farm</div><div class="navitem">Today</div><div class="navitem">Daily entry</div><div class="navitem">Sales</div><div class="navitem">Stock</div><div class="nav-group">SETUP</div><div class="navitem ${page === 'Users' ? 'active' : ''}">Users</div><div class="navitem">Farm settings</div><div class="railfoot"><div class="navitem ${page === 'Account' ? 'active' : ''}">Account</div><div class="navitem">Help</div><div class="navitem">Night mode</div><div class="navitem">Sign out</div></div></aside><div class="content"><div class="${page === 'Account' ? 'account' : ''}">${body}</div></div></div><nav class="tabbar" aria-label="Navigation"><span>Today</span><span>Daily entry</span><span>Sales</span><span>Stock</span><span>More</span></nav>`;
}
const status = state => `<span class="status ${state === 'On' ? '' : state === 'Off' ? 'off' : 'pending'}"><i></i>${state}</span>`;
function account() {
  const on = !['off','setting-up','done'].includes(cfg.state);
  const title = on ? 'On' : cfg.state === 'setting-up' ? 'Set-up not finished' : 'Off';
  const summary = `<div class="row"><div><h3>${cap(t.twoFactor)}</h3><p class="muted">Add a code from your ${t.authenticator} when you sign in.</p>${status(title)}</div>${!on ? `<div class="actions">${button(cfg.state === 'setting-up' ? 'Continue set-up' : 'Set up', 'enrol', 'primary')}</div>` : ''}</div>`;
  const management = on ? `<div class="row"><div><h3>${cap(t.recovery)}s</h3><p><span class="count">${cfg.state === 'low' ? 1 : 8}</span> codes left</p><p class="caption">Each code works once if you cannot use your ${t.authenticator}.</p></div><div class="actions">${button('Regenerate', 'regenerate', 'outlined')}</div></div>${cfg.state === 'low' ? alert('You have 1 code left. Save a new set before you need it.', 'warning') : ''}<div class="row"><p class="muted">Remove the extra code at sign-in.</p>${button('Turn off', 'turn-off', 'danger-text')}</div>` : cfg.state === 'setting-up' ? `<p class="muted">Scan the QR code and confirm a code to finish. ${cap(t.twoFactor)} is still off.</p>` : `<p class="muted">You sign in with your password only.</p>`;
  let html = shell(`<p class="eyebrow">Your account</p><h1>Account</h1><p class="muted">You are signed in as <strong>Ana · Admin</strong>.</p>${accordion('Preferences', '<p class="muted">Language · English</p><p class="muted">Entry unit · Tray</p>')}${accordion('Change password', '<p class="muted">Change the password for your account.</p>')}${accordion('Security', `${cfg.state === 'done' ? alert(`${cap(t.twoFactor)} is off.`, 'success') : ''}${summary}${management}`, true)}${accordion('Connected apps', '<p class="muted">1 connected app can act as you.</p>')}`);

  if(['signed-in','connect-return'].includes(state))return pkAuth(`<h2>${connect?'Continue to Farm Ledger':'Signed in'}</h2>${alert('Signed in to Sunrise Farm.','success')}<p class="identity">ana@example.test</p><p class="muted">Sunrise Farm is now remembered on this device.</p><div class="actions">${button(connect?'Review app permissions':'Continue',connect?'pk-connect':'pk-home','primary')}</div>`,connect);
  if(state==='password-change')return pkAuth(`<h2>Change your password</h2><p>Your passkey signed you in. Your Admin has reset your password, so you must change it before continuing.</p>${field('New password','pk-new-password',{password:true,hint:'At least 12 characters'})}${field('Confirm new password','pk-confirm-password',{password:true})}<div class="actions">${button('Change password','pk-signed-in','primary')}</div>`);
  if(second) {
    const code=state==='second-code'||state==='second-recovery',recovery=state==='second-recovery';
    return pkAuth(`<h2>Verify your sign-in</h2><p class="identity">ana@example.test</p><p class="caption">Sunrise Farm · Password confirmed</p>${code?`<p class="muted">Enter ${recovery?'a recovery code':'an authenticator code'}.</p>${field(recovery?'Recovery code':'Authenticator code','pk-login-code',{recovery,hint:recovery?'16 characters, with or without the hyphens.':'6 digits from your authenticator app.'})}<div class="actions">${button('Sign in','pk-signed-in','primary')}${button(recovery?'Use an authenticator code':'Use a recovery code',recovery?'pk-login-code':'pk-login-recovery')}${button('Use a passkey','pk-login-second')}</div>`:`<p class="muted">Use a passkey to finish signing in.</p><div class="actions">${button('Use a passkey','pk-signed-in','primary')}${state==='second-passkey-only'?'':button('Use an authenticator code','pk-login-code','outlined')}</div>${state==='second-passkey-only'?'<p class="caption">No authenticator app is set up. Your password alone cannot finish signing in.</p>':''}`}<div class="actions">${button('Back to sign in','pk-login-back')}</div>`);
  }
  const off=state==='off';
  const errors={cancelled:'Passkey sign-in was cancelled. Try again or use your password.',unknown:'This passkey could not sign you in. Try another passkey or use your password.', 'wrong-farm':'This passkey does not belong to the farm code entered. Clear the farm code to use the passkey’s farm, or choose another passkey.'};
  const passkey=off?'':`<div class="actions pk-passkey-signin">${button('Sign in with a passkey','pk-signed-in','outlined')}</div><p class="caption">You can leave the farm code blank when using a passkey.</p>`;
  const fields=`${pkField('Farm code','pk-farm',{value:state==='wrong-farm'?'sunrise-farm':'',hint:off?'Your farm code.':'Required with your password.'})}${pkField('Email','pk-email',{autocomplete:off?'username':'username webauthn',type:'email'})}${pkField('Password','pk-password',{autocomplete:'current-password',type:'password'})}<div class="actions">${button('Sign in','pk-login-second','primary')}</div>`;
  return pkAuth(`<h2>Sign in</h2>${errors[state]?alert(errors[state],state==='cancelled'?'warning':'error'):''}${cfg.direction==='b'&&!off?passkey+'<div class="pk-divider">Or use your password</div>':''}${fields}${cfg.direction==='a'?passkey:''}`,connect);
}
function pkAutofill() {
  return pkAuth(`<h2>Sign in</h2>${pkField('Farm code','pk-farm',{hint:'Required with your password.'})}${cfg.direction==='b'?'<p class="caption pk-autofill-help">Choose a saved passkey in Email to sign in without a password.</p>':''}<div class="pk-autofill-anchor">${pkField('Email','pk-email',{autocomplete:'username webauthn',type:'email'})}<aside class="pk-browser-preview" aria-label="Illustrative browser suggestion"><p class="caption">Browser suggestion (illustration)</p><strong>ana@example.test (Sunrise Farm)</strong><p class="caption">Passkey · farm.example.test</p>${button('Use saved passkey','pk-signed-in')}</aside></div>${pkField('Password','pk-password',{type:'password',autocomplete:'current-password'})}<div class="actions">${button('Sign in','pk-login-second','primary')}${button('Sign in with a passkey','pk-signed-in','outlined')}</div><p class="caption">You can leave the farm code blank when using a passkey.</p>`);
}
function pkStepup() {
  const state=cfg.state,consent=state.startsWith('consent'),method=state.endsWith('recovery')?'recovery':state.endsWith('code')?'code':'passkey';
  if(state==='done')return shell(`<h1>Users</h1>${alert('Password set for ben@example.test.','success')}`,'Users');
  const proof=pkProof({method,app:!state.endsWith('passkey-only'),combined:true});
  if(consent)return `<main class="consentbg"><div class="consent-wrap"><div class="consent-top"><strong>Sunrise Farm</strong><strong class="identity">ana@example.test</strong></div><div class="consent"><h2>Let Farm Ledger act as you?</h2><p class="caption">Unverified app · Returns to this computer</p><p>Choose what this app can do.</p><div class="permissions"><label class="check"><input type="checkbox" checked>Read farm data</label><label class="check"><input type="checkbox" checked>Record daily entries</label></div><p>Acts as you, with only your access.</p><span class="role">Admin</span>${proof}<div class="actions">${button(method==='passkey'?'Use passkey and allow':'Allow','pk-consent-ok','primary')}${button('Cancel','pk-consent-cancel')}</div><p class="caption">Disconnect it anytime in Account / Connected apps.</p><details class="ruled"><summary>Details</summary><p class="muted">This app chose its own name. Cluckwork has not verified it.</p><p>Signed in as ana@example.test</p></details></div></div></main>`;
  return users('selected',false)+dialog('Set password',`<p class="identity">Ben · ben@example.test</p>${field('New password','pk-target-password',{password:true,hint:'At least 12 characters'})}${field('Confirm new password','pk-target-confirm',{password:true})}${state==='cancelled'?alert('Passkey check was cancelled. Nothing changed.','warning'):state==='wrong'?alert('That proof did not work. Nothing changed.'):''}${proof}`,button('Cancel','pk-users-back')+button(method==='passkey'?'Use passkey and set password':'Set password','pk-stepup-done','primary'));
}
function pkOwner() {
  if(cfg.state==='setup')return `<main class="pk-required"><div class="pk-required-inner"><p class="eyebrow">Account / Security</p><div class="acc"><div class="accbody"><h2>Protect your account</h2><p>${OWNER_NOTICE}</p><div class="row"><div><h3>Passkey</h3><p class="muted">Use your fingerprint, face or device PIN.</p></div><div class="actions">${button('Set up a passkey','pk-add','primary')}</div></div><div class="row"><div><h3>Two-factor authentication</h3><p class="muted">Use codes from an authenticator app.</p></div><div class="actions">${button('Set up two-factor authentication','pk-app','outlined')}</div></div><p class="caption">Either option meets the requirement. You can set up both.</p></div></div><div class="actions">${button('Sign out','pk-sign-out')}</div></div></main>`;
  return shell(`${alert(`${OWNER_NOTICE}.<br>Set up by 24 Nov 2026, 09:00 UTC.`,'warning')}<div class="actions">${button('Set up now','pk-owner-setup','primary')}</div><h1 class="ruled">Account</h1><p class="muted">Signed in as Ana · Admin</p>${accordion('Security','<p>Set up a passkey or the authenticator app to continue using the farm.</p>',true)}`);
}
function pkSuggestion() {
  return cfg.state==='skipped'?pkAuth(`<h2>Continue to your farm</h2><p>You can add a passkey later in Account / Security.</p><div class="actions">${button('Continue','pk-home','primary')}</div>`):pkAuth(`<h2>Sign in faster with a passkey</h2><p>Use your fingerprint, face or device PIN instead of typing your password.</p><p class="muted">You can still use your password with an authenticator code if you have the app.</p><div class="actions">${button('Create passkey','pk-add','primary')}${button('Not now','pk-skip')}</div>`);
}
function pkUsers() {
  const state=cfg.state,self=state==='self';
  let html=users(self?'self':'selected',false);
  const host=document.createElement('div');host.innerHTML=html;
  const inspector=host.querySelector('.inspector');
  inspector.querySelector('.facts').insertAdjacentHTML('beforeend',`<p><span class="caption">Passkeys</span><br>${state==='done'?'None':'2 registered'}</p>`);
  if(!self&&state!=='done')inspector.querySelector('.actions').insertAdjacentHTML('beforeend',button('Remove passkeys','pk-remove-all','danger-text'));
  if(state==='done')inspector.insertAdjacentHTML('afterbegin',alert('Passkeys removed for ben@example.test. Every session and connected app of this user ended.','success'));
  if(self)inspector.insertAdjacentHTML('beforeend','<p class="caption">Manage your own passkeys in Account / Security.</p>');
  html=host.innerHTML;
  if(state.startsWith('confirm'))html+=dialog('Remove Ben’s passkeys?',`<p class="identity">Ben · ben@example.test</p><p>Remove all 2 passkeys. Every session and connected app of this user ends, including their current device.</p><p class="muted">Their authenticator app and recovery codes stay in place. Reset two-factor authentication is a separate action.</p>${pkProof({method:state==='confirm-code'?'code':state==='confirm-recovery'?'recovery':'passkey',combined:true})}`,button('Cancel','pk-users-back')+button(state==='confirm'?'Use passkey and remove':'Remove passkeys','pk-users-done','danger'));
  return html;
}
const PK_RENDERERS={'pk-account':pkAccount,'pk-registration':pkRegistration,'pk-login':pkLogin,'pk-autofill':pkAutofill,'pk-stepup':pkStepup,'pk-owner':pkOwner,'pk-suggestion':pkSuggestion,'pk-users':pkUsers};
function pkAct(action) {
  const keyAction=/^pk-(rename|remove)-(\d)$/.exec(action);
  if(keyAction){pkSelectedKey=Number(keyAction[2]);configure({state:keyAction[1]});(frame.querySelector('.dlg input')??frame.querySelector('.dlg .close')).focus({preventScroll:true});return;}
  const routes={
    'pk-add':{screen:'pk-registration',state:cfg.screen!=='pk-account'||cfg.state==='empty'?'stepup-password':cfg.state==='app-only'?'stepup-app-only':['one-owner','last-factor'].includes(cfg.state)?'stepup-passkey-only':'stepup-passkey'},
    'pk-app':{screen:'enrolment',state:'scan'},'pk-account-back':{screen:'pk-account',state:'both'},'pk-removed':{state:'removed'},
    'pk-registration-first':{state:cfg.state==='stepup-password'?'first':cfg.state.includes('app-only')?'with-app':'later'},'pk-create':{state:'success'},'pk-registration-done':{screen:'pk-account',state:'one-owner'},
    'pk-login-second':{screen:'pk-login',state:'second'},'pk-login-code':{screen:'pk-login',state:'second-code'},'pk-login-recovery':{screen:'pk-login',state:'second-recovery'},'pk-login-back':{screen:'pk-login',state:'ready'},
    'pk-signed-in':{screen:'pk-login',state:cfg.state==='connect'?'connect-return':'signed-in'},'pk-connect':{screen:'pk-stepup',state:'consent'},'pk-owner-setup':{state:'setup'},'pk-skip':{state:'skipped'},
    reset:{screen:'users',direction:'a-password',state:'confirm'},'set-password':{screen:'pk-stepup',state:'dialog'},'pk-users-back':{screen:'pk-users',state:'selected'},'pk-remove-all':{state:'confirm'},'pk-users-done':{state:'done'},'pk-home':{screen:'pk-account',state:'both'},
  };
  if(['pk-code','pk-recovery','pk-passkey'].includes(action)) {
    const drafts=[...frame.querySelectorAll('input[id]')].map(input=>({id:input.id,value:input.value}));
    const permissions=[...frame.querySelectorAll('.permissions input')].map(input=>input.checked);
    const method=action==='pk-code'?'code':action==='pk-recovery'?'recovery':'passkey';
    const base=cfg.state.startsWith('consent')?'consent':cfg.screen==='pk-registration'?(cfg.state.includes('app-only')?'stepup-app-only':'stepup'):cfg.screen==='pk-users'?'confirm':cfg.screen==='pk-account'?'remove':'dialog';
    configure({state:base==='stepup-app-only'&&method==='code'?base:method==='passkey'?(base==='stepup'?'stepup-passkey':base):`${base}-${method}`});
    for(const draft of drafts){const input=frame.querySelector(`#${draft.id}`);if(input&&!input.id.includes('proof-code')){input.value=draft.value;}}
    frame.querySelectorAll('.permissions input').forEach((input,index)=>{input.checked=permissions[index];});
    return;
  }
  if(action==='pk-renamed'){pkNames[pkSelectedKey]=frame.querySelector('#pk-name').value.trim()||'Passkey';configure({state:'both'});return;}
  if(action==='pk-proof-ok'){frame.querySelector('.dlg-actions button:last-child').disabled=false;return;}
  if(action==='pk-stepup-done'){configure({state:'done'});return;}
  if(action==='pk-sign-out'){configure({screen:'pk-login',state:'ready'});return;}
  if(action==='pk-consent-ok'||action==='pk-consent-cancel'){frame.querySelector('.consent').innerHTML=`<h2>${action==='pk-consent-ok'?'Connection approved':'Connection cancelled'}</h2><p>${action==='pk-consent-ok'?'Return to Farm Ledger.':'Nothing was connected.'}</p>`;return;}
  if(action==='close'){configure({screen:cfg.screen==='pk-registration'||cfg.screen==='pk-account'?'pk-account':'pk-users',state:cfg.screen==='pk-registration'||cfg.screen==='pk-account'?'both':'selected'});return;}
  if(routes[action])configure(routes[action]);
  frame.querySelector('.dlg input:not(:disabled),.dlg .close')?.focus({preventScroll:true});
}

function configure(next = {}) {
  cfg = {...cfg,...(next.screen && next.screen !== cfg.screen && !next.direction ? {direction:SCREENS[next.screen].recommended} : {}),...next};
  const screen = SCREENS[cfg.screen];
  if (!screen.directions[cfg.direction]) cfg.direction = screen.recommended;
  if (!screen.states.includes(cfg.state)) cfg.state = screen.states[0];
  document.documentElement.dataset.theme = cfg.theme;
  frame.className = `${cfg.width === 390 ? 'phone' : ''} ${cfg.state === 'long' ? 'long' : ''}`;
  frame.dataset.screen = cfg.screen;
  frame.innerHTML = ({account,enrolment,recovery,login,stepup,users,...PK_RENDERERS}[cfg.screen])();
  const modal = frame.querySelector('.scrim');
  if (modal) for (const sibling of frame.children) if (sibling !== modal) sibling.inert = true;
  for (const [id, values] of Object.entries({screen:Object.fromEntries(Object.entries(SCREENS).map(([key,value]) => [key,value.name])),direction:screen.directions,state:Object.fromEntries(screen.states.map(s => [s,s]))})) {
    const select = document.getElementById(id);
    select.innerHTML = Object.entries(values).map(([value,label]) => `<option value="${value}">${label}${id === 'direction' && value === screen.recommended ? (cfg.screen.startsWith('pk-') ? ' · recommended' : ' · selected') : ''}</option>`).join('');
    select.value = cfg[id];
  }
  document.querySelector('#width').value = cfg.width;
  document.querySelector('#theme').value = cfg.theme;
  document.querySelector('#labnote').textContent = `${REASONS[cfg.screen]} Prototype only. Buttons simulate states. Keys and the QR are placeholders. Recovery codes are generated samples.`;
  saved = cfg.state === 'saved';
}
for (const id of ['screen','direction','state','width','theme']) document.getElementById(id).addEventListener('change', e => configure({[id]: id === 'width' ? Number(e.target.value) : e.target.value}));
frame.addEventListener('change', e => {
  if (e.target.id !== 'saved') return;
  saved = e.target.checked;
  frame.querySelector('[data-action="finish"]').disabled = !saved;
});
frame.addEventListener('keydown', e => {
  const dlg = frame.querySelector('.dlg');
  if (!dlg) return;
  if (e.key === 'Escape') { e.preventDefault(); act('close'); }
  if (e.key === 'Tab') {
    const controls = [...dlg.querySelectorAll('button:not(:disabled),input:not(:disabled),summary')];
    if (e.shiftKey && document.activeElement === controls[0]) { e.preventDefault(); controls.at(-1).focus(); }
    else if (!e.shiftKey && document.activeElement === controls.at(-1)) { e.preventDefault(); controls[0].focus(); }
  }
});
frame.addEventListener('click', e => { const control=e.target.closest('[data-action]'); if(control && !control.disabled) act(control.dataset.action); });
function act(action) {
  if (cfg.screen.startsWith('pk-')) { pkAct(action); return; }
  if (action === 'use-recovery' || action === 'use-authenticator') {
    const passwordDraft = [...frame.querySelectorAll('input[type="password"]')].map(input => [input.id,input.value]);
    const permissions = [...frame.querySelectorAll('.permissions input')].map(input => input.checked);
    const recovery = action === 'use-recovery';
    const daily = codeState().daily;
    const method = daily ? `daily${recovery ? '-recovery' : ''}` : 'recovery';
    let state;
    if (cfg.screen === 'login') state = cfg.state.startsWith('connect') ? (daily || recovery ? `connect-${method}` : 'connect') : (daily || recovery ? method : 'code');
    else if (cfg.screen === 'account') state = (cfg.state.startsWith('turn-off') ? 'turn-off' : 'regenerate') + (daily || recovery ? `-${method}` : '');
    else if (cfg.screen === 'users') state = daily || recovery ? method : 'confirm';
    else if (cfg.state.startsWith('consent')) state = daily || recovery ? `consent-${method}` : (cfg.direction === 'b' ? 'consent-verify' : 'consent');
    else state = daily || recovery ? method : (cfg.direction === 'b' ? 'verify' : 'dialog');
    configure({state});
    for (const [id,value] of passwordDraft) frame.querySelector(`#${id}`).value = value;
    frame.querySelectorAll('.permissions input').forEach((input,index) => { input.checked=permissions[index]; });
    frame.querySelector('input[autocomplete="one-time-code"]').focus({preventScroll:true});
    return;
  }

  const recoveryFailure = codeState().daily ? 'daily-recovery-wrong' : 'recovery-wrong';
  const routes = {
    enrol:{screen:'enrolment',state:'scan'},'account-off':{screen:'account',state:'off'},'regenerated-codes':{screen:'recovery',state:'regenerated'},'account-on':{screen:'account',state:'on'},'account-done':{screen:'account',state:'done'},
    regenerate:{state:'regenerate'},'turn-off':{state:'turn-off'},'new-codes':{screen:'recovery',state:'new'},
    scan:{state:'scan'},confirm:{state:'confirm'},verify:{state:'verify'},'login-code':{state:cfg.state.startsWith('connect') ? 'connect' : 'code'},
    'login-submit':{state:cfg.state.startsWith('connect') ? (codeState().recovery ? `connect-${recoveryFailure}` : 'connect-wrong') : codeState().recovery ? recoveryFailure : 'wrong'},
    'login-back':{state:cfg.state.startsWith('connect') ? 'connect-password' : 'password'},'stepup-back':{state:'dialog'},'stepup-submit':{state:codeState().recovery ? recoveryFailure : 'wrong'},
    'set-password':{screen:'stepup',state:'dialog'},reset:{state:'confirm'},'reset-submit':{state:'done'},'users-selected':{screen:'users',state:'selected'},
    'consent-verify':{state:cfg.direction === 'b' ? 'consent-verify' : codeState().recovery ? `consent-${recoveryFailure}` : 'consent-wrong'},'consent-back':{state:'consent'},'consent-done':{state:codeState().recovery ? `consent-${recoveryFailure}` : 'consent-wrong'},
  };
  if (action === 'consent-cancel') { frame.querySelector('.consent').innerHTML='<h2>Connection cancelled</h2><p>Nothing was connected.</p>'; return; }
  if (action === 'finish') { if(saved) configure({screen:'account',state:'on'}); return; }
  if (action === 'close') { configure(cfg.screen === 'account' ? {state:'on'} : cfg.screen === 'users' ? {state:'selected'} : cfg.state.startsWith('consent') ? {state:'consent'} : {screen:'users',state:'selected'}); return; }
  if (action === 'copy-key') { document.querySelector('[data-action="copy-key"]').textContent='Key copied (preview)'; return; }
  if (action === 'copy-codes' || action === 'download') {
    if (action === 'download') {
      const link=document.createElement('a');
      link.href=URL.createObjectURL(new Blob([`Cluckwork design preview\nSample ${t.recovery}s only. These codes do not work.\n${SAMPLE_CODES.join('\n')}\n`],{type:'text/plain'}));
      link.download='cluckwork-recovery-preview.txt'; link.click(); URL.revokeObjectURL(link.href);
    }
    configure({state:action === 'download' ? 'downloaded' : 'copied'}); return;
  }
  if (routes[action]) configure(routes[action]);
  const focus = frame.querySelector('.dlg input:not(:disabled),.dlg .close');
  if (focus) focus.focus({preventScroll:true});
}
window.configure=configure;
window.LAB={screens:SCREENS};
configure();
</script>
