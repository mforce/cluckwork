<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cluckwork · OAuth screens · direction lab (#798, #799, #800)</title>
<style>
/* Tokens copied from web/src/styles.css (aubergine palette). The lab redeclares
   them because it must open as a standalone file; it invents none. */
.frame{--brand:#4a154b;--brand-press:#611f69;--on-brand:#fff;--on-brand-mute:#d9bdde;--ink:#1d1d1d;--muted:#696969;--link-rule:#c0c0c0;--canvas:#f3eee8;--surface:#fffdf9;--surface-2:#f3eee8;--lavender:#f9f0ff;--hairline:#ded3ca;--rule:var(--hairline);--rule-strong:rgba(29,29,29,.28);--row-hover:#faf5fc;--error:#bd3a14;--success:#007a5a;--warn:#8a5a00;--danger:#a8320f;--on-danger:#fff;--tint-accent:#f3e9f5;--tint-ok:#e2f2ec;--tint-warn:#f7ecd9;--tint-danger:#f9e5df;--tint-muted:#eeeaf0;--stat-accent:var(--brand);--focus:var(--stat-accent);--scrim:rgba(29,21,33,.42);--shadow-dialog:0 1px 2px rgba(29,21,33,.06),0 12px 32px rgba(29,21,33,.10),0 40px 96px rgba(29,21,33,.12);--shadow-bar:0 -1px 0 rgba(29,21,33,.05),0 -16px 40px rgba(29,21,33,.07);--input-line:rgba(29,29,29,.23);--font:"Inter Variable",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,serif;--tf-bg:var(--canvas);color-scheme:light}
.frame.dark{--ink:#f2ecf4;--muted:#b3a8b8;--link-rule:#5c5560;--canvas:#302733;--surface:#231d25;--surface-2:#302733;--lavender:#241c2a;--hairline:#554655;--rule-strong:rgba(242,236,244,.28);--row-hover:#2b2231;--error:#ff8666;--success:#4bbf97;--warn:#e0a44a;--danger:#bc3c14;--tint-accent:#33203a;--tint-ok:#14342b;--tint-warn:#3a2e18;--tint-danger:#3a2019;--tint-muted:#2c2333;--stat-accent:#e2b4e6;--scrim:rgba(0,0,0,.62);--shadow-dialog:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.4),0 40px 96px rgba(0,0,0,.45);--shadow-bar:0 -1px 0 rgba(0,0,0,.35),0 -16px 40px rgba(0,0,0,.3);--input-line:rgba(242,236,244,.23);color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:#1f1a21;font:14px/1.43 system-ui,sans-serif}
/* ---- lab chrome (not part of any design) ---- */
.lab{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#1f1a21;color:#fff;border-bottom:1px solid #3d3340}
.lab strong{margin-right:auto;font-weight:600}
.lab select,.lab button{background:#352c38;color:#fff;border:1px solid #6d5f70;border-radius:4px;padding:6px 10px;min-height:34px;font:inherit}
.lab button[aria-pressed=true]{background:#fff;color:#2a222c}
.lab .chosen::after{content:" (recommended)";opacity:.7}
.lab .picked::after{content:" (chosen)";opacity:.7}
.lab .history{opacity:.65}
.labnote{color:#d6c9d4;font-size:12px;padding:8px 16px 0;max-width:1280px;margin:0 auto}
.labnote b{color:#fff}
.stage{padding:16px;display:flex;justify-content:center}

/* ---- the frame: one viewport of the app ---- */
.frame{position:relative;width:1280px;height:800px;overflow:hidden;background:var(--canvas);color:var(--ink);font:400 14px/20px var(--font);font-variation-settings:"opsz" 14;display:flex;flex-direction:column;box-shadow:0 12px 45px #0006}
.frame.phone{width:390px;height:844px;font-size:16px;line-height:24px}
.frame.full{height:auto;min-height:800px;overflow:visible}
.frame.phone.full{min-height:844px}
:where(.frame) :where(button,input,select){font:inherit;color:inherit}
.frame :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.frame p{margin:0 0 12px}
.frame a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--link-rule);text-underline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* type: FarmThemeProvider.tsx typography */
.overline{font-size:12px;line-height:2.66;letter-spacing:.08333em;color:var(--muted);margin:0}
.h1{font:600 40px/44px var(--serif);margin:0 0 8px}
.h2{font:600 24px/28px var(--serif);margin:0 0 8px}
.phone .h2{font-size:28px;line-height:32px}
.h3{font:600 15px/22px var(--font);margin:0}
.body2{font-size:15.2px;line-height:1.43}
.muted{color:var(--muted)}
.caption{font-size:12px;line-height:16px;color:var(--muted)}
.sechead{font:600 13px/16px var(--font);color:var(--ink);padding:0 0 8px;margin:20px 0 0;border-bottom:1px solid var(--rule-strong)}

/* shell: AppLayout (lavender rail) + BottomNav */
.app{display:flex;flex:1;min-height:0}
.rail{width:244px;flex:none;background:var(--lavender);border-right:1px solid var(--hairline);display:flex;flex-direction:column;min-height:0}
.farm{display:flex;gap:10px;align-items:center;padding:24px 20px;font-weight:700;color:var(--stat-accent);font-size:15px}
.egg{width:18px;height:23px;border:2px solid currentColor;border-radius:60% 60% 50% 50%}
.navlist{flex:1;overflow:auto}
.navlabel{font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);padding:0 24px;margin:16px 0 4px}
.frame .navitem,.frame .tabbar a{text-decoration:none}
.navitem{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 13px;border-left:3px solid transparent;color:var(--ink);text-decoration:none;font-size:14px}
.navitem.on{background:var(--brand);border-left-color:var(--brand);color:var(--on-brand);font-weight:600}
.navitem.new::after{content:"proposed";margin-left:auto;font-size:11px;color:var(--muted)}
.navitem.on.new::after{color:var(--on-brand-mute)}
.railfoot{border-top:1px solid var(--hairline);padding:12px 8px}
.railfoot div{display:flex;align-items:center;gap:8px;padding:6px 8px;font-size:14px}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.content{flex:1;min-width:0;overflow:auto;padding:40px 44px 64px}
.content>.page{max-width:1120px}
.full .content{overflow:visible}
.phone .app{flex-direction:column}
.phone .rail{display:none}
.phone .content{padding:20px 16px 28px}
.tabbar{display:none}
.phone .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));flex:none;height:64px;background:var(--surface);border-top:1px solid var(--hairline);box-shadow:var(--shadow-bar)}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;line-height:14px;color:var(--muted);text-decoration:none}
.tabbar a.on{color:var(--stat-accent);font-weight:600;box-shadow:inset 0 2px var(--stat-accent)}
.tabbar .ico{width:22px;height:22px}

/* controls: MUI Button / TextField (outlined) / Alert / Accordion as themed */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:700 15.2px/1.2 var(--font);letter-spacing:.01em;border-radius:4px;padding:8px 16px;min-height:38px;border:1px solid transparent;background:transparent;color:var(--stat-accent);cursor:pointer;text-align:center}
.btn.contained{background:var(--brand);color:var(--on-brand)}
.btn.outlined{border-color:color-mix(in srgb,var(--stat-accent) 50%,transparent)}
.btn.danger{background:var(--danger);color:var(--on-danger)}
.btn.danger-out{border-color:color-mix(in srgb,var(--error) 50%,transparent);color:var(--error)}
.btn.danger-text{color:var(--error);padding:4px 8px;min-height:30px}
.btn.small{padding:4px 10px;min-height:30px;font-size:14px}
.phone .btn{min-height:48px}
.phone .btn.small,.phone .btn.danger-text{min-height:44px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.phone .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
.tf{position:relative;margin:8px 0 0;max-width:24rem}
.tf input,.tf select{display:block;width:100%;height:56px;padding:16px 14px;border:1px solid var(--input-line);border-radius:4px;background:var(--tf-bg);font-size:16px}
.tf.small input,.tf.small select{height:40px;padding:8px 12px;font-size:14px}
.tf label{position:absolute;left:10px;top:-8px;padding:0 4px;background:var(--tf-bg);font-size:12px;line-height:16px;color:var(--muted);max-width:calc(100% - 20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf input:focus-visible,.tf select:focus-visible{outline:none;border:2px solid var(--stat-accent);padding:15px 13px}
.tf.err input{border-color:var(--error)}
.tf.err label,.tf .helper.err{color:var(--error)}
.tf .helper{font-size:12px;line-height:16px;margin:4px 14px 0;color:var(--muted)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:6px 16px;border-radius:4px;margin:12px 0;font-size:14px;line-height:20px;color:var(--ink)}
.alert .ico{margin-top:8px;flex:none}
.alert p{margin:7px 0}
.alert.error{background:var(--tint-danger)}.alert.error .ico{color:var(--error)}
.alert.success{background:var(--tint-ok)}.alert.success .ico{color:var(--success)}
.alert.info{background:var(--tint-accent)}.alert.info .ico{color:var(--stat-accent)}
details.acc{border:1px solid var(--hairline);border-radius:4px;margin:0 0 12px;overflow:hidden;background:var(--surface);--tf-bg:var(--surface)}
details.acc>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:12px 16px;background:var(--surface-2);cursor:pointer}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:focus-visible{outline-offset:-3px}
details.acc[open]>summary .chev{transform:rotate(180deg)}
.accbody{padding:18px}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.st.ok{--c:var(--success)}.st.warn{--c:var(--warn)}.st.accent{--c:var(--stat-accent)}
.st.ring i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.count{font-weight:400;color:var(--muted);font-size:14px}
table.ledger{width:100%;border-collapse:collapse}
.ledger th{font:600 13px/16px var(--font);text-align:left;color:var(--ink);padding:8px 12px 8px 0;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
.ledger td{padding:8px 12px 8px 0;border-bottom:1px solid var(--rule);vertical-align:top;line-height:20px}
.ledger td.act{text-align:right;padding-right:0;white-space:nowrap}
.ledger .sub{display:block;color:var(--muted);font-size:13px;line-height:18px}
.prow{padding:14px 0;border-bottom:1px solid var(--rule)}
.prow:first-child{padding-top:4px}
.prow .name{font-weight:600}
.prow .meta{color:var(--muted);font-size:14px;line-height:20px;margin:2px 0 0}
.prow .btn{width:100%;margin-top:12px}

/* dialog: Dialog.tsx shell (12px radius, dialog shadow, Georgia title) */
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:30;padding:16px}
.dlg{position:relative;width:min(480px,100%);background:var(--surface);border-radius:12px;box-shadow:var(--shadow-dialog);padding:24px}
.dlg .h2{padding-right:40px}
.dlg .x{position:absolute;top:14px;right:14px;width:40px;height:40px;border:0;background:none;border-radius:50%;color:var(--muted);display:grid;place-items:center}
.dlg .actions{justify-content:flex-end}
.phone .dlg{align-self:end}
.phone .dlg .h2{font:700 17px/24px var(--font)}

/* ---- auth surface (Login B "Working desk" = AuthShell.tsx) ---- */
.authbg{flex:1;overflow:auto;background:var(--surface-2);display:flex;align-items:center;justify-content:center;padding:28px;position:relative}
.full .authbg{overflow:visible}
.phone .authbg{align-items:flex-start;padding:66px 14px 22px}
.theme-toggle{position:absolute;top:18px;right:18px;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--ink);display:grid;place-items:center}
.authcard{display:flex;width:min(880px,100%);border:1px solid var(--hairline);background:var(--surface);--tf-bg:var(--surface)}
.phone .authcard{flex-direction:column}
.authside{width:50%;flex:none;background:var(--brand);color:var(--on-brand);padding:38px;display:flex;flex-direction:column}
.phone .authside{width:auto;padding:20px}
.authside .overline{color:var(--on-brand-mute)}
.authside .h1{color:var(--on-brand)}
.phone .authside .h1{font-size:28px;line-height:32px}
.authside .tag{color:var(--on-brand-mute);font-size:15.2px}
.phone .authside .tag{display:none}
.authside .foot{margin-top:auto;padding-top:24px;color:var(--on-brand-mute);font-size:12px;line-height:16px}
.authmain{flex:1;padding:32px;min-width:0}
.phone .authmain{padding:20px}
.authmain .tf{max-width:none}
.authmain .actions .btn{flex:1}

/* ---- consent ---- */
.perms{list-style:none;margin:8px 0 0;padding:0}
.perms li{display:grid;grid-template-columns:20px 1fr;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--rule)}
.perms li:last-child{border-bottom:0}
.perms .ico{margin-top:1px;color:var(--stat-accent)}
.perms b{font-weight:600}
.perms .d{grid-column:2;color:var(--muted);font-size:14px;line-height:20px}
.perms .tagline{grid-column:2;margin-top:2px;font-size:13px}
.acting{border-left:3px solid var(--stat-accent);background:var(--tint-accent);padding:10px 14px;margin:16px 0;border-radius:0 4px 4px 0}
.acting p{margin:0}
.acting p+p{margin-top:4px}
.who{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin:0 0 4px}
.fine{font-size:13px;line-height:18px;color:var(--muted)}
/* B: plain statement */
.stmt{flex:1;overflow:auto;background:var(--canvas)}
.full .stmt{overflow:visible}
.stmt-col{max-width:600px;margin:0 auto;padding:40px 24px 40px}
.phone .stmt-col{padding:20px 16px 0}
.stmt .farmline{display:flex;align-items:center;gap:10px;color:var(--stat-accent);font-weight:700;margin-bottom:28px}
.phone .stmt .farmline{margin-bottom:16px}
.stmt .farmline span.muted{font-weight:400}
.stmt .h1{font-size:40px;line-height:44px}
.phone .stmt .h1{font-size:30px;line-height:34px}
.stmt .lead{font-size:18px;line-height:27px;margin:12px 0 4px}
.phone .stmt .lead{font-size:17px;line-height:25px}
.stmt .tf{--tf-bg:var(--canvas)}
.stickybar{position:sticky;bottom:0;background:var(--surface);box-shadow:var(--shadow-bar);padding:12px 16px;margin:20px -16px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.full .stickybar{position:static;box-shadow:none;background:transparent;padding:0 0 24px;margin:20px 0 0}
.desk-actions{display:flex;gap:8px;margin-top:20px}
/* C: asks vs gets */
.matrix-wrap{flex:1;overflow:auto;background:var(--canvas)}
.full .matrix-wrap{overflow:visible}
.matrix-col{max-width:820px;margin:0 auto;padding:36px 24px}
.phone .matrix-col{padding:20px 16px}
.matrix-head{display:flex;align-items:center;gap:10px;color:var(--stat-accent);font-weight:700;margin-bottom:20px}
.panel{background:var(--surface);border:1px solid var(--hairline);border-radius:8px;padding:28px;--tf-bg:var(--surface)}
.phone .panel{padding:18px 16px}
table.matrix{width:100%;border-collapse:collapse;margin:16px 0 4px}
.matrix caption{caption-side:bottom;text-align:left;padding-top:10px;font-size:14px}
.matrix th,.matrix td{text-align:left;vertical-align:top;padding:10px 14px 10px 0;border-bottom:1px solid var(--rule)}
.matrix thead th{font:600 13px/16px var(--font);border-bottom:1px solid var(--rule-strong)}
.matrix tbody th{font-weight:600;width:24%}
.matrix td.gets{background:var(--tint-accent);padding-left:14px}
.matrix thead th.gets{background:var(--tint-accent);padding-left:14px}
.mcard{border-bottom:1px solid var(--rule);padding:12px 0}
.mcard .row{display:grid;gap:0;margin-top:6px;font-size:15px;line-height:22px}
.mcard .row span:first-child{color:var(--muted);font-size:13px}
.mcard .row.gets{background:var(--tint-accent);margin-left:-8px;padding:6px 8px;border-radius:4px}
.steps{display:flex;gap:6px;margin:0 0 6px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--hairline)}
.steps i.on{background:var(--stat-accent)}
.nextbox{margin:20px 0 0;padding:14px;border:1px solid color-mix(in srgb,var(--on-brand) 35%,transparent);border-radius:8px;font-size:14px;line-height:20px}
.nextbox b{display:block;color:var(--on-brand);font-size:15px;margin-bottom:2px}
.nextbox span{color:var(--on-brand-mute)}
.nextbox.inmain{display:none;margin:0 0 16px;border-color:var(--hairline);background:var(--tint-accent)}
.nextbox.inmain b{color:var(--ink)}
.nextbox.inmain span{color:var(--muted)}
.phone .authside .nextbox{display:none}
.phone .nextbox.inmain{display:block;padding:12px 14px}

/* ---- compact consent (D, E, F) ---- */
.k-wrap{flex:1;overflow:auto;background:var(--canvas)}
.full .k-wrap{overflow:visible}
.k-col{max-width:480px;margin:0 auto;padding:32px 24px 40px}
.phone .k-col{padding:16px 12px 24px}
.k-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;font-size:13px;color:var(--muted)}
.k-top .farmname{display:flex;align-items:center;gap:8px;color:var(--stat-accent);font-weight:700;font-size:14px}
.k-card{background:var(--surface);border:1px solid var(--hairline);border-radius:8px;padding:24px;--tf-bg:var(--surface)}
.phone .k-card{padding:18px 16px}
.k-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0 0 6px}
.k-head .h2{margin:0}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:600;line-height:1;white-space:nowrap}
.badge .ico{width:14px;height:14px}
.badge.unv{color:var(--warn)}
.badge.role{color:var(--stat-accent)}
.k-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;font-size:13px;line-height:18px;color:var(--muted);margin:0 0 14px}
.k-meta .ico{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.k-rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-strong)}
.k-rows li{display:grid;grid-template-columns:22px 1fr;gap:0 12px;padding:10px 0;border-bottom:1px solid var(--rule)}
.k-rows .ico{color:var(--stat-accent);margin-top:1px}
.k-rows b{font-weight:600}
.k-rows .l{grid-column:2;font-size:13px;line-height:18px;color:var(--muted)}
.k-rows li.new{background:var(--tint-accent);margin:0 -8px;padding:10px 8px;border-radius:4px}
.k-rows li.had b{font-weight:400;color:var(--muted)}
.k-acts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:12px 0 4px;font-weight:600}
.k-acts .ico{color:var(--stat-accent)}
.k-acts-t{display:inline-flex;gap:8px;align-items:flex-start}
.k-after{margin:14px 0 0;font-size:13px;line-height:18px;color:var(--muted)}
details.k-details{margin-top:10px;border-top:1px solid var(--rule)}
details.k-details>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--ink)}
details.k-details[open]>summary .chev{transform:rotate(180deg)}
details.k-details p{font-size:14px;line-height:20px;color:var(--ink);margin:0 0 8px}
.k-card .tf,.k-main .tf,.k-ledger-wrap .tf{max-width:none;margin-top:14px}
.k-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
/* E: the login card */
.k-side-who{margin-top:18px;font-size:14px;line-height:20px;color:var(--on-brand-mute)}
.k-side-who b{display:block;color:var(--on-brand);font-size:16px}
.phone .k-side-who{margin-top:8px}
.phone .authside.k-side .h1{font-size:22px;line-height:26px;margin:0}
.phone .authside.k-side .overline{display:none}
.phone .authside.k-side{flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:2px 14px;padding:14px 20px}
.phone .authside.k-side .k-side-who{margin:0;min-width:0;overflow-wrap:anywhere}
.phone .authside.k-side .k-side-who b{font-size:14px}
.authside.k-side .badge.role{color:var(--on-brand);margin-top:6px}
/* F: ledger */
dl.k-ledger{display:grid;grid-template-columns:auto 1fr;margin:14px 0 0;border-top:1px solid var(--rule-strong)}
dl.k-ledger dt,dl.k-ledger dd{padding:9px 0;border-bottom:1px solid var(--rule);margin:0}
dl.k-ledger dt{font-size:13px;color:var(--muted);padding-right:16px;line-height:22px}
dl.k-ledger dd{line-height:22px}
dl.k-ledger dd .ico{width:16px;height:16px;color:var(--stat-accent);vertical-align:-3px;margin-right:6px}
dl.k-ledger dd .ln{display:block}
dl.k-ledger dd .ln+.ln{margin-top:4px}
dl.k-ledger .l{color:var(--muted);font-size:13px}
.wc{font-weight:600;color:#fff}

/* ---- account / owner variants ---- */
.cards{display:grid;gap:12px}
.card{border:1px solid var(--hairline);border-radius:8px;padding:16px;background:var(--surface)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:12px 0 0;font-size:14px;line-height:20px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.card .btn{margin-top:14px}
.phone .card .btn{width:100%}
.summary-line{font-size:15.2px;line-height:22px;margin:0 0 14px}
details.inner{border-bottom:1px solid var(--rule)}
details.inner>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;min-height:48px}
details.inner>summary::-webkit-details-marker{display:none}
details.inner>summary .grow{flex:1;min-width:0}
details.inner[open]>summary .chev{transform:rotate(180deg)}
details.inner .innerbody{padding:0 4px 14px 4px}
.nudge{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--tint-warn);border-left:3px solid var(--warn);padding:10px 14px;border-radius:0 4px 4px 0;margin:0 0 14px}
.nudge p{margin:0;flex:1;min-width:200px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.why{border-left:3px solid var(--rule-strong);padding:2px 0 2px 12px;color:var(--muted);margin:0 0 16px;max-width:70ch}
.person{font:600 14px/20px var(--font);margin:16px 0 0;padding-bottom:6px;border-bottom:1px solid var(--rule-strong);display:flex;gap:8px;align-items:baseline}
.person:first-child{margin-top:0}
.filterrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.filterrow .tf{margin:0;width:220px}

/* ---- audit (C "Focus panels" = AuditPage.tsx + styles.css .audit-*) ---- */
.audit-scope{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px;flex-wrap:wrap}
.audit-scope small{color:var(--muted);font-size:12px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;min-height:38px}
.chk input{width:18px;height:18px;accent-color:var(--stat-accent);margin:0}
.audit-filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.audit-filters.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.phone .audit-filters,.phone .audit-filters.five{grid-template-columns:repeat(2,minmax(0,1fr))}
.phone .audit-filters .span2{grid-column:1/-1}
.audit-filters .tf{max-width:none;margin:0}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--link-rule);text-underline-offset:2px;cursor:pointer;min-height:24px}
.audit-events{display:grid;gap:12px;max-width:760px;margin-top:12px}
details.ev{overflow:hidden;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}
details.ev>summary{padding:16px;cursor:pointer;font-weight:700;background:var(--surface-2);list-style:none;display:flex;align-items:center;gap:10px}
details.ev>summary::-webkit-details-marker{display:none}
details.ev>summary:focus-visible{outline-offset:-3px}
details.ev>summary .grow{flex:1;min-width:0}
details.ev>summary .line2{display:block;font-weight:400;font-size:14px;line-height:20px;color:var(--muted);margin-top:2px}
details.ev>summary .line2 b{font-weight:600;color:var(--ink)}
.evbody{display:grid;gap:8px;padding:18px}
.evbody>*{margin:0;overflow-wrap:anywhere}
.evbody .kv{margin:0;grid-template-columns:90px 1fr}
.seg{display:inline-flex;border:1px solid var(--input-line);border-radius:4px;overflow:hidden;margin-top:14px}
.seg button{border:0;border-right:1px solid var(--input-line);background:transparent;padding:7px 14px;min-height:38px;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--tint-accent);color:var(--stat-accent);font-weight:700}
.phone .seg{display:flex}
.phone .seg button{flex:1;min-height:44px;padding:7px 8px}
.appmark{color:var(--stat-accent)}
.via{font-weight:500}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

const LONG_WORDS = "pakikumpirma pahintulot pinagkakatiwalaan tagapangasiwa talaan sakahan kasalukuyang pagpapatunay pamamahala".split(" ");
const isLong = () => S.state === "long";
function pad(s) {
  if (!isLong() || !s) return s;
  const want = Math.ceil(s.replace(/<[^>]+>/g, "").length * 0.4);
  let add = "", i = s.length % LONG_WORDS.length;
  while (add.length < want) { add += " " + LONG_WORDS[i % LONG_WORDS.length]; i++; }
  return s + add;
}
const e = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function t(k, v = {}) {

  return pad(T[k].replace(/\{(\w+)\}/g, (_, n) => e(v[n] ?? "")));
}

  const ctl = o.options

// Visible words from the top of the frame down to the password field (closed
// Details, icons and screen-reader-only text excluded). Shown in the lab note.
function countWordsBeforePassword(root) {
  const pw = root.querySelector("#pw");
  if (!pw) return null;
  const stop = pw.closest(".tf");
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n = 0, node;
  while ((node = walker.nextNode())) {
    if (stop.compareDocumentPosition(node) & Node.DOCUMENT_POSITION_FOLLOWING || stop.contains(node)) break;
    const el = node.parentElement;
    if (!el || !el.checkVisibility({ visibilityProperty: true }) || el.closest(".sr,.theme-toggle")) continue;
    n += node.textContent.split(/\s+/).filter((w) => /[\p{L}\p{N}]/u.test(w)).length;
  }
  return n;
}
window.wordsBeforePassword = () => countWordsBeforePassword(document.getElementById("frame"));

const RENDER = { consent: () => ({ a: consentA, b: consentB, c: consentC, d: consentD, e: consentE, f: consentF }[S.dir])(), login, account, owner, audit };
function render() {
  const f = document.getElementById("frame");
  f.className = `frame ${S.vp === 390 ? "phone" : ""} ${S.theme === "dark" ? "dark" : ""} ${S.full ? "full" : ""}`;
  f.innerHTML = RENDER[S.screen]();
  // lab chrome
  document.getElementById("screen").value = S.screen;
  document.getElementById("dirs").innerHTML = Object.entries(DIRS[S.screen]).map(([k, label]) =>
    `<button data-dir="${k}" aria-pressed="${k === S.dir}" class="${CHOSEN[S.screen] === k ? "picked" : RECOMMENDED[S.screen] === k ? "chosen" : ""} ${(HISTORY[S.screen] || []).includes(k) ? "history" : ""}">${label}</button>`).join(" ");
  const ss = document.getElementById("state");
  ss.innerHTML = STATES[S.screen].map(([v, l]) => `<option value="${v}" ${v === S.state ? "selected" : ""}>${l}</option>`).join("");
  document.getElementById("role").hidden = S.screen !== "consent";
  document.getElementById("role").value = S.role;
  document.getElementById("vp").setAttribute("aria-pressed", S.vp === 390);
  document.getElementById("theme").setAttribute("aria-pressed", S.theme === "dark");
  const wc = S.screen === "consent" ? countWordsBeforePassword(f) : null;
  document.getElementById("dirnote").innerHTML = e(NOTES[S.screen][S.dir]) + (wc != null ? ` <span class="wc">${wc} visible words before the password field.</span>` : "");
  document.querySelectorAll("[data-dir]").forEach((b) => b.onclick = () => { S.dir = b.dataset.dir; render(); });
  f.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => { S.state = b.dataset.go; render(); });
  f.querySelectorAll('[data-act="allow"]').forEach((b) => b.onclick = () => { S.state = "wrong"; render(); });
  // land the viewport on the part each screen adds, so a fixed-height frame shows it
  const sc = f.querySelector("#scroller"), anchor = f.querySelector("#anchor");
  if (sc && anchor && !S.full && S.scroll !== false) sc.scrollTop = Math.max(0, anchor.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 16);
  if (sc && !S.full && S.screen === "consent" && S.state === "wrong") { const pw = f.querySelector("#pw"); sc.scrollTop = Math.max(0, pw.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 200); }
  const on = f.querySelector(".navitem.on"), nl = f.querySelector(".navlist");
  if (on && nl && !S.full) nl.scrollTop = Math.max(0, on.offsetTop - nl.offsetTop - nl.clientHeight / 2);
  const af = f.querySelector("[data-autofocus]");
  if (af && document.hasFocus()) af.focus({ preventScroll: true });
}
document.getElementById("screen").onchange = (ev) => { S.screen = ev.target.value; S.dir = RECOMMENDED[S.screen]; S.state = "normal"; render(); };
document.getElementById("state").onchange = (ev) => { S.state = ev.target.value; render(); };
document.getElementById("role").onchange = (ev) => { S.role = ev.target.value; render(); };
document.getElementById("vp").onclick = () => { S.vp = S.vp === 390 ? 1280 : 390; render(); };
document.getElementById("theme").onclick = () => { S.theme = S.theme === "dark" ? "light" : "dark"; render(); };
window.configure = (cfg) => { Object.assign(S, cfg); render(); };
render();
