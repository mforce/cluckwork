/div><div class=\"nav-foot\"><button class=\"nav-action\"><svg class=\"ico\"><use href=\"#i-moon\"/></svg>Night</button><button class=\"nav-action\"><svg class=\"ico\"><use href=\"#i-logout\"/></svg>Sign out</button><span class=\"version\">v0.1.2</span></div></aside>";
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chosenDirections={settings:'c',help:'b',login:'b',audit:'c',export:'c',account:'c',setpassword:'b'};
let page='settings',direction=chosenDirections.settings,preview='normal',part=0,selected=0;
const btn=(text,cls='',action='demo')=>`<button class="${cls}" data-action="${action}">${e(text)}</button>`;
const text=(ns,key,values={})=>Object.entries(values).reduce((s,[k,v])=>s.replaceAll('{{'+k+'}}',v),copy[ns][key]||key);
function field(label,value='',options=null,extra=''){return `<label class="field">${e(label)}${options?`<select ${extra}>${options.map(o=>`<option ${o===value?'selected':''}>${e(o)}</option>`).join('')}</select>`:`<input value="${e(value)}" ${extra}>`}</label>`}
const notice=(msg,error=false)=>`<div class="notice ${error?'error':''}" role="${error?'alert':'status'}">${msg}</div>`;
const head=(title,intro)=>`<header class="head"><span class="eyebrow">${{settings:'Farm configuration · Owner',help:'User guide',audit:'Read-only record',export:'Your farm data',account:'Personal preferences'}[page]||''}</span><h1>${e(title)}</h1><p>${e(intro)}</p></header>`;
function sections(items){if(direction==='a')return items.map(([t,b])=>`<section class="section"><h2>${t}</h2>${b}</section>`).join('');if(direction==='c')return items.map(([t,b],i)=>`<details class="group" ${i===part?'open':''}><summary>${t}</summary><section class="section">${b}</section></details>`).join('');return `<div class="columns"><nav class="section-nav" aria-label="Sections">${items.map(([t],i)=>`<button data-part="${i}" class="${part===i?'active':''}">${t}</button>`).join('')}</nav><section class="section"><h2>${items[part][0]}</h2>${items[part][1]}</section></div>`}
function settings(){const c=copy.settings;const image=kind=>`<section class="media"><h3>${c[kind+'SectionHeading']}</h3><div class="preview">${preview==='empty'?'No image':kind==='logo'?'Meadowlark · logo preview':'Farm banner · image placeholder'}</div><small>${preview==='empty'?e(c[kind+'NoneMessage']):'Illustrative image slot — existing-image state'}</small><div class="actions">${btn(c[(preview==='empty'?'upload':'replace')+kind[0].toUpperCase()+kind.slice(1)+'Button'],'','upload')}${preview==='empty'?'':btn('Remove','danger','remove-'+kind)}</div><details><summary>Image guidance</summary><p>${text('settings',kind+'RulesHint',{cap:'server-configured limit'})}</p>${kind==='logo'?`<p>${c.logoSquareHint}</p>`:''}</details></section>`;
const identity=`<div class="media-grid">${image('logo')}${image('banner')}</div><h3 style="margin-top:22px">${c.paletteLegend}</h3><p class="muted">${c.paletteHint}</p><div class="swatches">${['Aubergine','Forest','Slate','Terracotta'].map((n,i)=>`<button class="${!i?'selected':''}" data-palette="${n}"><i style="--swatch:${['#4a154b','#245941','#3b5264','#9a4c35'][i]}"></i>${n}</button>`).join('')}</div>`;
const locale=`<div class="fields">${field(c.farmNameLabel,'Meadowlark')}${field(c.timezoneLabel,'Asia/Manila')}${field(c.localeLabel,'en-PH')}${field(c.currencyLabel,'PHP',null,'readonly aria-describedby="currency-note"')}${field(c.unitSystemLabel,'Metric',['Metric','Imperial'])}${field(c.firstDayOfWeekLabel,'Follow the locale',['Follow the locale','Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'])}</div><p class="notice" id="currency-note">${text('settings','currencyLockedNote',{code:'PHP'})}</p>`;
const policy=`<div class="fields">${field(c.defaultStepperUnitLabel,'Individual',['Individual','Dozen','Tray'])}${field(c.workerSaleAllocationPolicyLabel,'Assigned flocks only',['Assigned flocks only','All farm flocks'])}${field(c.maxDiscountPercentLabel,'',null,'type="number" min="0" max="100" placeholder="No limit"')}</div><p class="muted">${c.defaultStepperUnitHint}</p><p class="muted">${c.workerSaleAllocationPolicyHint}</p><p class="muted">${c.maxDiscountPercentHint}</p>`;
const formats=`<div class="fields">${field(c.dateFormatLabel,'Follow the locale',['Follow the locale','MM/dd/yyyy','dd/MM/yyyy','yyyy-MM-dd','Custom…'],'data-format="date"')}${field(c.timeFormatLabel,'Follow the locale',['Follow the locale','h:mm tt','HH:mm','Custom…'],'data-format="time"')}<div id="date-custom" hidden>${field(c.customDateFormatLabel,'')}</div><div id="time-custom" hidden>${field(c.customTimeFormatLabel,'')}</div></div><p class="muted">${c.effectNote}</p>`;
return head(c.heading,c.intro)+(preview==='error'?notice(c.versionConflictMessage,true):'')+`<div class="settings-body">${sections([['Identity & images',identity],[c.localizationSectionHeading,locale],['Counting & sales',policy],['Date & time formats',formats]])}</div><div class="savebar"><small>Image actions are separate from Save settings.</small>${btn(c.saveButton,'primary','save-settings')}</div><p class="demo-status" aria-live="polite"></p>`}
function passwordFields(set=false){const c=set?copy.auth:copy.account;return `<div class="password-fields">${field(set?c.temporaryPasswordLabel:c.currentPasswordLabel,'',null,'type="password" autocomplete="off"')}${field(text(set?'auth':'account',set?'setPasswordNewLabel':'newPasswordLabel',{min:12}),'',null,'type="password" autocomplete="off"')}${field(set?c.setPasswordConfirmLabel:c.confirmPasswordLabel,'',null,'type="password" autocomplete="off"')}</div>`}
function account(){const c=copy.account;const pref=`<p>${c.languageHint}</p>${field(c.language,'English',['English','Español','Tagalog'])}<p style="margin-top:16px">${c.stepperUnitHint}</p>${field(c.stepperUnit,'Farm default (Individual)',['Farm default (Individual)','Individual','Dozen','Tray'])}`;const pw=`<p>${c.changePasswordHint}</p>${passwordFields()}${preview==='error'?notice(c.passwordMismatchError,true):''}<div class="actions">${btn(c.changePasswordButton,'primary','password-preview')}</div>`;return head(c.heading,'You are signed in with the Admin role.')+(direction==='b'?`<div class="password-layout"><section class="section"><h2>${c.preferences}</h2>${pref}</section><section class="section"><h2>${c.changePasswordHeading}</h2>${pw}</section></div>`:sections([[c.preferences,pref],[c.changePasswordHeading,pw]]))}
function auth(){const c=copy.auth,set=page==='setpassword';const recent=preview==='empty'?'':`<small>${c.recentFarms}</small><div class="recent">${['meadowlark','default'].map(f=>`<span class="farm-choice"><button data-farm="${f}">${f}</button><button aria-label="Forget ${f}" data-forget="${f}">×</button></span>`).join('')}</div>`;return `<div class="auth-surface"><button class="auth-theme" data-action="theme">Night / light</button><div class="auth-composition"><aside class="auth-context"><div><span class="eyebrow">Poultry farm management</span><h1>Cluckwork</h1><p>Daily entry · Stock · Sales</p></div><small>${set?'Set your password before entering the farm.':'Farm code identifies the farm you are signing into.'}</small></aside><section class="auth-form"><h2>${set?c.setPasswordHeading:c.title}</h2>${set?`<p>${c.setPasswordHint}</p>${passwordFields(true)}`:`${recent}${field(c.farmCode,preview==='empty'?'':'meadowlark',null,'id="farm-code"')}${field(c.email,'',null,'type="email" placeholder="you@example.com"')}${field(c.password,'',null,'type="password" autocomplete="off"')}`}${preview==='error'?notice(set?c.setPasswordMismatchError:c.invalidCredentials,true):''}${!set&&preview==='empty'?notice(c.noAdminYet+' '+c.noAdminYetHint):''}${btn(set?c.setPasswordButton:c.signIn,'primary','auth-preview')}${set?btn(c.setPasswordSignOut,'quiet','auth-preview'):''}<small>No credentials are submitted by this prototype.</small></section></div></div>`}
const topics=[['getting-around','gettingAround'],['dashboard','dashboard'],['signing-in','signingIn'],['daily-loop','dailyLoop'],['mistakes','mistakes'],['dialogs','dialogs'],['daily-entry','dailyEntry'],['flocks','flocks'],['stock','stock'],['history','history'],['sales','sales'],['products','products'],['grades','grades'],['reports','reports'],['expenses','expenses'],['inventory','inventory'],['feed','feed'],['water','water'],['roles','roles'],['farm-settings','farmSettings'],['farm-palette','farmPalette'],['account','account'],['audit','audit'],['export','export'],['install','install'],['glossary','glossary']];

function rich(value){
  return e(value).replace(/&lt;(strong|code)&gt;([\s\S]*?)&lt;\/\1&gt;/g,(_,tag,body)=>`<${tag}>${body}</${tag}>`);
}
function help(){
  const c=copy.help;
  const prose=(id,prefix)=>prefix==='glossary'
    ? Object.keys(c).filter(k=>k.startsWith('glossary')&&k.endsWith('Term')).map(k=>`<details data-help-item><summary>${e(c[k])}</summary><p>${rich(c[k.replace(/Term$/,'Def')])}</p></details>`).join('')
    : prefix==='mistakes'
      ? `<p>${rich(c.mistakesIntro)}</p><dl>${Array.from({length:10},(_,i)=>`<dt><strong>${e(c['mistakesRow'+(i+1)+'Mistake'])}</strong></dt><dd>${rich(c['mistakesRow'+(i+1)+'Fix'])}</dd>`).join('')}</dl>`
      : Object.keys(c).filter(k=>k.startsWith(prefix)&&!k.endsWith('Heading')).map(k=>`<p>${rich(c[k])}</p>`).join('');
  return head(c.heading,c.lead)+`<div class="search"><input id="help-search" aria-label="${e(c.searchLabel)}" placeholder="${e(c.searchPlaceholder)}">${btn(c.searchClear,'','clear-search')}</div><p class="help-count" aria-live="polite">${e(c.searchShortcutHint)}</p><div class="${direction==='b'?'columns':''}"><nav class="help-rail" aria-label="Help contents">${topics.map(([id,p])=>`<a href="#${id}">${e(c[p+'Heading'])}</a>`).join('')}</nav><article class="help-article">${topics.map(([id,p],i)=>direction==='c'?`<details data-help-section id="${id}" ${!i?'open':''}><summary>${e(c[p+'Heading'])}</summary>${prose(id,p)}</details>`:`<section class="section" data-help-section id="${id}"><h2>${e(c[p+'Heading'])}</h2>${prose(id,p)}</section>`).join('')}</article></div>`;
}
const auditRows=[['2026-09-18 08:42:10','owner@example.com','Sales order line updated','Sales order · 9ca32d10','Large Eggs $0.45 → $0.35 (list $0.45)'],['2026-09-18 08:41:03','owner@example.com','Sales order line added','Sales order · 9ca32d10','Large Eggs ×30 at list $0.45'],['2026-09-18 07:30:00','manager@example.com','Daily entry adjusted','Daily entry · 24a609e2','Recount']];
function audit(){const c=copy.audit;return head(c.heading,c.intro)+`<div class="scope"><small>Illustrative audit rows · UTC timestamps</small><label><input type="checkbox" id="scope"> Preview one record’s history</label></div><div class="filters">${field(c.entityTypeFilterLabel,'All types',['All types','Sales order','Daily entry'])}${field(c.actionFilterLabel,'All actions',['All actions','Sales order line added','Sales order line updated'])}${field(c.fromLabel,'',null,'type="date"')}${field(c.toLabel,'',null,'type="date"')}</div>${btn('Clear filters','','clear-audit')}${preview==='error'?notice('Could not load the audit log.',true):preview==='empty'?`<p>${c.emptyMessage}</p>`:direction==='a'?`<div class="swipe">Swipe columns ↔</div><div class="tablewrap"><table><thead><tr>${[c.whenHeader,c.whoHeader,c.actionHeader,c.entityHeader,c.detailsHeader].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${auditRows.map((r,i)=>`<tr tabindex="0" data-audit="${i}">${r.map(v=>`<td>${e(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:direction==='c'?auditRows.map(r=>`<details class="group"><summary>${r[0]} · ${r[2]}</summary><div class="section">${r.slice(1).map(v=>`<p>${e(v)}</p>`).join('')}</div></details>`).join(''):`<div class="audit-list">${auditRows.map((r,i)=>`<button class="audit-row ${selected===i?'selected':''}" data-audit="${i}"><small>${r[0]} UTC</small><span>${r[2]}<br>${r[3]}</span><span>${r[1]}</span></button>`).join('')}</div><section class="inspector"><h3>Selected event</h3><dl>${[c.whenHeader,c.whoHeader,c.actionHeader,c.entityHeader,c.detailsHeader].map((k,i)=>`<dt>${k}</dt><dd>${e(auditRows[selected][i])}</dd>`).join('')}</dl></section>`}`}
function exportPage(){const c=copy.export;const ds=Object.keys(c).filter(k=>k.startsWith('dataset.')).map(k=>c[k]);const rows=ds.map(d=>`<div class="dataset"><span>${e(d)}</span>${btn('CSV','','download')}</div>`).join('');return head(c.heading,c.intro)+(preview==='error'?notice('Could not prepare the download. Try again.',true):'')+`<section class="download-hero"><div><h2>${c.fullBackupHeading}</h2><p>${c.fullBackupHint}</p></div>${btn(c.fullBackupButton,'primary','download')}</section><h2>${c.singleDatasetsHeading}</h2>${direction==='c'?`<p>Select one dataset. The full backup remains available above.</p>${field('Dataset',ds[0],ds)}<div class="actions">${btn('Download CSV','primary','download')}</div>`:`<div class="datasets">${rows}</div>`}<p class="demo-status" aria-live="polite"></p>`}
function render(){const viewport=document.querySelector('#viewport');viewport.classList.remove('a','b','c');viewport.classList.add(direction);document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.direction===direction));document.querySelector('#surface').innerHTML=['login','setpassword'].includes(page)?auth():`<div class="shell">${navHTML}<main class="workspace">${({settings,help,audit,account,export:exportPage}[page])()}</main><nav class="phone-nav"><a>Daily entry</a><a>Stock</a><a>Sales</a><a>History</a><a class="active" href="#" data-action="more">More</a></nav></div>`;document.querySelectorAll('.nav a').forEach(a=>{a.classList.toggle('active',a.textContent.trim()===({settings:'Farm settings',help:'Help',audit:'Audit',export:'Export',account:'Account'}[page]));});wire()}
function showDialog(title,body,ok='Close'){document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-copy').textContent=body;document.querySelector('#dialog-ok').textContent=ok;document.querySelector('#dialog-ok').onclick=()=>document.querySelector('#dialog').close();document.querySelector('#dialog').showModal()}
function wire(){document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{part=+b.dataset.part;render()});document.querySelectorAll('[data-palette]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-palette]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.querySelectorAll('[data-format]').forEach(s=>s.onchange=()=>document.querySelector('#'+s.dataset.format+'-custom').hidden=s.value!=='Custom…');document.querySelectorAll('[data-farm]').forEach(b=>b.onclick=()=>document.querySelector('#farm-code').value=b.dataset.farm);document.querySelectorAll('[data-forget]').forEach(b=>b.onclick=()=>showDialog(text('auth','forgetFarmTitle',{farmCode:b.dataset.forget}),copy.auth.forgetFarmBody,copy.auth.forgetFarmConfirm));document.querySelectorAll('[data-audit]').forEach(b=>{b.onclick=()=>{selected=+b.dataset.audit;render()};b.onkeydown=ev=>{if(ev.key==='Enter')b.click()}});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=ev=>{ev.preventDefault();const a=b.dataset.action;if(a==='theme'){document.body.classList.toggle('dark');return}if(a==='clear-search'){document.querySelector('#help-search').value='';filterHelp('');return}if(a==='clear-audit'){document.querySelectorAll('.filters input').forEach(x=>x.value='');document.querySelectorAll('.filters select').forEach(x=>x.selectedIndex=0);return}if(a.startsWith('remove-')){const k=a.slice(7),s=k[0].toUpperCase()+k.slice(1);showDialog(copy.settings['remove'+s+'ConfirmTitle'],copy.settings['remove'+s+'ConfirmBody'],copy.settings['remove'+s+'ConfirmLabel']);return}if(a==='more'){showDialog('More', [...document.querySelectorAll('.nav a')].map(x=>x.textContent.trim()).join(' · '));return}showDialog('Prototype preview',a==='download'?'Download controls demonstrated only. No farm data is requested.':a==='upload'?'Image selection and validation belong to the production screen. No file is uploaded here.':'This is a layout preview; nothing is saved or submitted.')});const search=document.querySelector('#help-search');if(search)search.oninput=()=>filterHelp(search.value);const scope=document.querySelector('#scope');if(scope)scope.onchange=()=>{document.querySelector('.head h1').textContent=scope.checked?'Sales order history':copy.audit.heading;document.querySelector('.scope small').textContent=scope.checked?'Record scope retained when clearing filters':'Illustrative audit rows · UTC timestamps'}}
function filterHelp(q){let n=0;document.querySelectorAll('[data-help-section]').forEach(s=>{const hit=s.textContent.toLowerCase().includes(q.toLowerCase());s.hidden=!hit;if(hit){n++;if(s.tagName==='DETAILS'&&q)s.open=true}});document.querySelector('.help-count').textContent=q?(n?`${n} sections match “${q}”`:`Nothing matches “${q}”.`):copy.help.searchShortcutHint;updateHelpCurrent()}
function updateHelpCurrent(){
  const workspace=document.querySelector('.workspace'),rail=document.querySelector('.help-rail');
  if(!workspace||!rail)return;
  const visible=[...document.querySelectorAll('[data-help-section]:not([hidden])')];
  const phone=document.querySelector('#viewport').clientWidth<=700;
  const threshold=phone?rail.getBoundingClientRect().bottom+20:workspace.getBoundingClientRect().top+42;
  let current=visible[0];
  for(const section of visible){if(section.getBoundingClientRect().top<=threshold)current=section;else break;}
  if(workspace.scrollHeight>workspace.clientHeight&&workspace.scrollTop+workspace.clientHeight>=workspace.scrollHeight-2)current=visible.at(-1);
  const previous=rail.querySelector('[aria-current="location"]');
  const next=[...rail.querySelectorAll('a')].find(a=>a.hash==='#'+current?.id);
  if(previous!==next)previous?.removeAttribute('aria-current');
  if(!next)return;
  next.setAttribute('aria-current','location');
  const r=rail.getBoundingClientRect(),n=next.getBoundingClientRect();
  if(phone){
    if(n.left<r.left+8)rail.scrollLeft+=n.left-r.left-8;
    else if(n.right>r.left+rail.clientWidth-8)rail.scrollLeft+=n.right-(r.left+rail.clientWidth)+8;
  }else{
    if(n.top<r.top)rail.scrollTop+=n.top-r.top;
    else if(n.bottom>r.bottom)rail.scrollTop+=n.bottom-r.bottom;
  }
}

  }

    ev.preventDefault();
    const search=document.querySelector('#help-search');search.value='';filterHelp('');
    const target=document.getElementById(link.hash.slice(1));
    if(target.tagName==='DETAILS')target.open=true;
    const workspace=document.querySelector('.workspace'),rail=document.querySelector('.help-rail');

    workspace.scrollTop+=target.getBoundingClientRect().top-workspace.getBoundingClientRect().top-inset;
    updateHelpCurrent();
  });
  if(page==='help'){
    document.querySelector('.workspace').onscroll=updateHelpCurrent;
    updateHelpCurrent();
  }
};
