ll sidebar logo above.","bannerWorkingMessage":"Working…","bannerUpdatedMessage":"Banner updated.","bannerRemovedMessage":"Banner removed.","bannerOversizeMessage":"That image is {{actualKb}} KB. The limit is {{limitKb}} KB.","removeBannerConfirmTitle":"Remove the farm banner?","removeBannerConfirmBody":"The post-login splash is skipped until another banner is uploaded.","removeBannerConfirmLabel":"Remove banner","localizationSectionHeading":"Localization","farmNameLabel":"Farm name","timezoneLabel":"Timezone","timezoneUnknownWarning":"This browser does not know that timezone, so dates here would follow the device instead of the farm. Pick one from the list.","localeLabel":"Locale","currencyLabel":"Currency","currencyLockedNote":"The currency is fixed at {{code}}: this farm has already recorded amounts in it. Recorded money is never re-priced, so changing this would leave every stored total meaning something else.","unitSystemLabel":"Unit system","defaultStepperUnitLabel":"Daily Entry counting unit","defaultStepperUnitHint":"How much the Daily Entry +/− buttons count by for everyone on this farm — for example Tray to count by the tray (30 eggs) instead of one egg at a time. Each person can pick their own on their Account screen.","workerSaleAllocationPolicyLabel":"Worker sale allocation","workerSaleAllocationPolicyHint":"Controls which egg lots a restricted plain Worker's sale can draw from. Assigned flocks only is the default; owners can opt a farm into all farm flocks.","maxDiscountPercentLabel":"Maximum discount","maxDiscountPercentHint":"The largest discount a Sales or Worker user may put on one sale line, as a whole percent of that line's list price. Leave it blank for no limit. 0 is not the same as blank: it means sales staff may give nothing away. An owner or manager can always confirm an order that goes over it.","firstDayOfWeekLabel":"First day of week","followLocaleOption":"Follow the locale","paletteLegend":"Farm palette","paletteHint":"The accent colour for everyone on this farm. Each person still chooses light or night mode for themselves.","paletteAubergine":"Aubergine","paletteForest":"Forest","paletteSlate":"Slate","paletteTerracotta":"Terracotta","dateFormatLabel":"Date format","timeFormatLabel":"Time format","customFormatOption":"Custom…","customDateFormatLabel":"Custom date format","customTimeFormatLabel":"Custom time format","savingButton":"Saving…","saveButton":"Save settings","effectNote":"The timezone applies everywhere as soon as it is saved. Locale, unit system and the format overrides are recorded against the farm and will drive how amounts, dates and measurements are displayed once that formatting lands.","savedMessage":"Settings saved.","versionConflictMessage":"Someone else changed these settings while this screen was open. Reload and try again.","saveReadBackFailedMessage":"Saved. This screen could not read the settings back — reload the page before saving again.","refreshFailedMessage":"Saved. The rest of the app could not pick the change up — reload the page to be sure it is applied everywhere."},"account":{"preferences":"Preferences","language":"Language","languageHint":"The language the interface is shown in, just for you.","stepperUnit":"Daily Entry counting unit","stepperUnitHint":"How much the Daily Entry +/− buttons count by, just for you — pick a pack unit like Tray to count by the tray instead of the egg, or follow the farm default.","stepperUnitFarmDefaultOption":"Farm default ({{unit}})","stepperUnitSaveFailed":"Could not save — your counting unit was not changed.","heading":"Account","roleLine":"You are signed in with the <strong>{{role}}</strong> role.","changePasswordHeading":"Change password","changePasswordHint":"Changing your password signs you out everywhere else — this device stays signed in.","currentPasswordLabel":"Current password *","newPasswordLabel":"New password (min {{min}} chars) *","confirmPasswordLabel":"Confirm new password *","changePasswordButton":"Change password","passwordMismatchError":"The new passwords don't match.","passwordTooShortError":"The new password must be at least {{min}} characters.","passwordChangedMessage":"Password changed. Any other devices have been signed out."},"auth":{"title":"Cluckwork","farmCode":"Farm code","recentFarms":"Recent farms","forgetFarm":"Forget {{farmCode}}","forgetFarmTitle":"Forget {{farmCode}}?","forgetFarmBody":"This removes {{farmCode}} from Recent farms on this device. It does not change your account or other device preferences.","forgetFarmConfirm":"Forget farm","farmFromLink":"Signing in to farm: {{farmCode}}","unknownFarmCode":"That farm code is not recognised. Check it and try again.","farmSuspended":"This farm is suspended. Contact your administrator.","email":"Email","password":"Password","signIn":"Sign in","signingIn":"Signing in…","invalidCredentials":"Invalid email or password.","credentialsSuperseded":"Your credentials changed. Please sign in again.","accountDisabled":"Your account has been disabled.","farmSelectionRequired":"This browser holds sessions for several farms. Choose a farm and sign in.","tooManyAttempts":"Too many sign-in attempts. Please wait a few minutes and try again.","apiDown":"Could not sign in. Is the API running?","credentialsTooLong":"That's too long — check your email and password.","noAdminYet":"No administrator yet. This farm hasn't finished first-time setup, so there's no administrator account to sign in with.","noAdminYetHint":"Ask whoever set up this server to create the first administrator. The setup steps are in the project README.","setPasswordHeading":"Set your password","setPasswordHint":"This is your first sign-in. Set a new password to continue — the temporary one won't work again after this.","temporaryPasswordLabel":"Temporary password","setPasswordNewLabel":"New password (min {{min}} chars)","setPasswordConfirmLabel":"Confirm new password","setPasswordButton":"Set password","setPasswordSubmitting":"Setting password…","setPasswordSignOut":"Sign out","setPasswordMismatchError":"The new passwords don't match.","setPasswordTooShortError":"The new password must be at least {{min}} characters."},"audit":{"heading":"Audit log","intro":"Every corrective, destructive, or configuration change — who did it, when, and why. Rows are written with the change itself and never edited.","scopedHeading":"{{entityType}} history","scopedHeadingFallback":"Record history","entityTypeFilterLabel":"Record type","allEntityTypesOption":"All types","actionFilterLabel":"Action","allActionsOption":"All actions","whenHeader":"When (UTC)","whoHeader":"Who","actionHeader":"Action","entityHeader":"Entity","detailsHeader":"Details","detailsAtList":"at list {{amount}}","detailsAtPrice":"at {{amount}}","detailsListParen":"(list {{amount}})","detailsNoListPrice":"(no list price)","detailsDiscountReason":"Discount reason: {{reason}}","detailsDiscountReasonWithNote":"Discount reason: {{reason}} ({{note}})","fromLabel":"From","toLabel":"To","emptyMessage":"No audit events yet.","scopedEmptyMessage":"No audit events for this record yet.","filteredEmptyMessage":"No audit events match these filters.","scopedFilteredEmptyMessage":"No audit events for this record match these filters.","loadMoreButton":"load more"},"export":{"heading":"Export","intro":"Download your account's data as CSV files — a manual backup you can keep anywhere. Money values are exported in minor units (cents) with their currency, exactly as stored.","fullBackupHeading":"Full backup","fullBackupButton":"Download full backup (zip)","fullBackupHint":"One zip with every dataset below plus a manifest of row counts.","preparingButton":"Preparing…","singleDatasetsHeading":"Single datasets","dataset.flocks":"flocks","dataset.bird-movements":"bird-movements","dataset.daily-entries":"daily-entries","dataset.daily-entry-grades":"daily-entry-grades","dataset.egg-grades":"egg-grades","dataset.egg-lots":"egg-lots","dataset.customers":"customers","dataset.sales-orders":"sales-orders","dataset.sales-order-items":"sales-order-items","dataset.sales-order-allocations":"sales-order-allocations","dataset.payments":"payments","dataset.inventory-items":"inventory-items","dataset.inventory-lots":"inventory-lots","dataset.inventory-movements":"inventory-movements","dataset.feed-usages":"feed-usages","dataset.water-usages":"water-usages","dataset.expense-categories":"expense-categories","dataset.expenses":"expenses","dataset.egg-inventory-movements":"egg-inventory-movements","dataset.audit-events":"audit-events"},"help":{"eyebrow":"User guide","heading":"Help","lead":"How Cluckwork works, screen by screen — and how to undo mistakes.","contentsAriaLabel":"Help contents","contentsEyebrow":"Contents","searchLabel":"Search the guide","searchPlaceholder":"Type a term or a topic","searchClear":"Clear search","searchMatches":"Matches for “{{query}}”: {{sections}} in the guide, {{terms}} in the glossary.","searchNoMatches":"Nothing matches “{{query}}”.","searchShortcutHint":"Press / to search","glossaryJumpAriaLabel":"Glossary groups","openScreen":"Open {{screen}}","railGroupStartHere":"Start here","railGroupEveryDay":"Every day","railGroupSelling":"Selling","railGroupSupplies":"Supplies","railGroupFarm":"Farm & people","railGroupApp":"The app","glossaryGroupGettingAround":"Getting around","glossaryGroupSigningIn":"Signing in & who can do what","glossaryGroupFlocksEntry":"Flocks & daily entry","glossaryGroupEggsStock":"Eggs, grades & stock","glossaryGroupSalesMoney":"Sales & money","glossaryGroupSupplies":"Feed, water & supplies","glossaryGroupFarm":"Farm settings & branding","tocGettingAround":"Getting around","tocDashboard":"Dashboard","tocSigningIn":"Signing in","tocDailyLoop":"The daily loop","tocRoles":"Who can do what","tocDialogs":"Adding & correcting","tocDailyEntry":"Daily entry","tocFlocks":"Flocks & birds","tocGrades":"Egg grades","tocProducts":"Products","tocStock":"Stock","tocInventory":"Supplies & inventory","tocFeed":"Feed","tocWater":"Water","tocSales":"Customers & sales","tocReports":"Reports","tocExpenses":"Expenses","tocHistory":"History","tocAudit":"Audit log","tocExport":"Export & backup","tocFarmSettings":"Farm settings","tocFarmPalette":"Farm palette","tocAccount":"Your account","tocInstall":"Install on a phone","tocMistakes":"Fixing mistakes","tocGlossary":"Glossary","gettingAroundHeading":"Getting around","gettingAroundSidebar":"On a computer, every screen sits in the <strong>sidebar</strong> on the left, grouped by job.","gettingAroundTabs":"On a phone, the screens you use most are <strong>tabs across the bottom</strong>, in easy thumb reach. Which four you get depends on your role — a worker gets Daily entry, someone in sales gets Sales. Everything else is one tap away under <strong>More</strong>.","gettingAroundPageLoading":"The first time you open a screen after starting or updating Cluckwork, a brief page-loading message may appear while that screen opens. Navigation stays available; wait for the screen to appear.","gettingAroundErrorScreen":"If a screen ever shows <strong>\"Something went wrong\"</strong>, that is the app catching an error instead of leaving you on a blank page. Anything you had already saved is safe (anything you were still typing may need to be entered again) — tap <strong>Reload</strong>, or <strong>Back to the dashboard</strong> and try again. If it keeps happening, open \"Error details\" and send a screenshot.","gettingAroundWhereMessagesAppear":"A message about something that failed appears <strong>where the work is</strong>: if you were filling in a pop-up form, it appears inside that form, next to the fields it is about; if it was the screen itself — a list that would not load, say — it appears on the screen behind. So a form that refuses to save always tells you why without closing. Closing the form drops its message: that attempt is over, and anything the screen itself reported stays put.","gettingAroundSearchablePicker":"Flock and customer name fields are <strong>searchable pickers</strong>: type to search, use the arrow keys or a pointer to look through results, and press <strong>Enter</strong> or click a result to pick it. Typing just explores — your previous choice stays in effect until you pick a new one or press <strong>Escape</strong> to cancel. A long list shows <strong>Load more</strong>; a search or Load more that fails shows <strong>Retry</strong>. If a remembered or linked name can no longer be found, the field shows <strong>Unavailable</strong> with Retry.","dashboardHeading":"Dashboard","dashboardTiles":"<strong>Today</strong>: one tile per active flock with today's eggs and status, the ones without an entry first. A tile marked <strong>No entry</strong> is the house nobody has recorded yet — tap it to open Daily entry for that flock and day. Past twelve tiles, a link carries the rest.","dashboardTrend":"<strong>Last 14 days</strong>: eggs per day from the production report, with <strong>hen-day %</strong> for the last 7 finished days and how it moved against the 7 before. Point at a day, or tab into the chart and use the arrow keys, to read that day on its own. A day the farm submitted with no eggs keeps a mark on the baseline; a day nobody submitted is an empty slot and reads as <strong>No entry</strong>; a day only some flocks submitted is drawn hatched, because its total is the least the farm produced rather than what it produced. <strong>Peak</strong> and <strong>Avg</strong> come only from the days every flock recorded. Hen-day % divides by the hen-days of the flocks that recorded, so a flock that forgets lowers what the figure is measured over, never the rate itself. The window is fixed (yesterday back) and counts <strong>submitted days only</strong> — a day still in Draft reads as No entry until it is submitted, unlike Reports where you choose the range.","dashboardStock":"<strong>Stock</strong>: one <strong>stacked bar</strong> of what is available by grade, with the figures beside it; restricted eggs are noted after the total. It is the same total the Stock screen shows.","signingInHeading":"Signing in","signingInBasic":"Sign in with your <strong>farm code</strong>, then the email and password your administrator set up. A wrong password just says <strong>Invalid email or password</strong> — try again.","signingInRateLimit":"To slow down anyone guessing passwords, sign-in attempts from the same place are <strong>limited</strong>. After too many tries in a few minutes you'll see <strong>\"Too many sign-in attempts\"</strong> — that isn't a fault, just wait a few minutes and try again. Being <em>signed in</em> already is never affected; your work carries on normally.","signingInAccountLock":"Separately, too many wrong passwords for <em>one account</em> briefly lock <em>that</em> account. While it is locked, even the correct password still says <strong>Invalid email or password</strong>. The lock is temporary — wait up to about 15 minutes and try again.","signingInPersistence":"Your sign-in is kept in your browser securely and stays active as you work, even across reloads and with the app open in <strong>several tabs</strong> at once. After the app is <strong>updated</strong> you may be asked to sign in once more — that's expected.","signingInMultiTabResync":"Each farm keeps its own secure session in this browser, so farms open in different <strong>tabs</strong> no longer replace one another. A tab remembers its farm across reloads. A tab with no remembered farm that finds several sessions returns to sign-in rather than guessing — choose the farm code and sign in. The sign-in page also remembers farm codes you have signed in with on this device and offers them as a picker, and a ?farm= link prefills the field. Each remembered farm can be removed from that list with its Forget control; doing so does not clear another farm's session or any other preference on this device. No other farm's session is cleared.","signingInFirstRun":"<strong>First sign-in on a brand-new farm.</strong> There is no default password — an operator runs a one-time setup command that prints a temporary password and the farm code. Sign in with both and you'll immediately land on a <strong>Set your password</strong> screen instead of the normal app; nothing else works until you pick your own password there. This is separate from an ordinary <em>Change password</em>. Until that setup step has been run, trying to sign in tells you so and points you at whoever administers the server, rather than claiming your details were wrong.","signingInStepUp":"Eight actions on the <strong>Users</strong> screen ask you to <strong>re-enter your current password</strong> right there in the dialog: creating any user, resetting any user's password, changing any user's role, changing a login email, disabling a user, re-enabling a user, assigning a worker to a flock, and removing a worker's flock assignment. This confirms it's really you before handing out access or cutting someone else's off. Display-name changes do not ask again.","signingInCredentialEpoch":"When an administrator resets a password, your existing sign-in can be invalidated immediately. If you see a message that your credentials changed, sign in again with your current password.","interfaceLanguage":"<strong>Interface language.</strong> Everyone can choose the language the interface is shown in from <strong>Account → Preferences</strong> — English, Español, or Tagalog. Translation is a work in progress: the login and sales screens, error messages, and <strong>Account → Preferences</strong> itself are translated today; the rest of the Account screen (including the password section) and the rest of the app are being translated screen by screen. Until a screen is translated it simply shows in English, whatever language you picked.","dailyLoopHeading":"The daily loop","dailyLoopChain":"Everything in Cluckwork hangs off one chain: you record a <strong>daily entry</strong> for each flock (eggs by grade, losses, deaths), you <strong>submit</strong> it, and submitting creates dated <strong>egg lots</strong> — that's your sellable <strong>stock</strong>. A <strong>sales order</strong> takes from stock when you confirm it, always oldest eggs first. Feed flows the same way on the input side: purchases put feed into stock, daily usage draws it down per flock.","dailyLoopSummary":"Record entry → submit → egg lots → stock → order → confirm.","rolesHeading":"Who can do what","rolesWorkers":"Five kinds of sign-in. <strong>Workers</strong> run the daily loop — record and submit entries, receive feed, record feed and water usage, create customers, take orders from draft through confirm. A worker can be narrowed to <strong>assigned flocks</strong>: with no assignments they can record for any flock; the first assignment restricts them to the listed ones. Workers cannot create flocks — that is Owner/Manager administration.","rolesManagers":"<strong>Managers</strong> do everything workers do, plus operational work that <strong>undoes or corrects</strong>: voids, stock and water corrections, creating flocks and flock lifecycle changes, culls, the grade/product/item catalogs, expenses, money reports, the audit log, and exports.","rolesSalesReadOnly":"<strong>Sales</strong> sign-ins handle customers, orders, and <strong>payments</strong> — but no production capture and no expenses. <strong>Read-only</strong> sign-ins see stock, history, and reports, and can change nothing.","rolesAdmin":"<strong>Admin (owner)</strong> does everything a manager does and is the only role that manages Farm settings, branding, and users: creating sign-ins on the <strong>Users</strong> screen (email, password, an optional name, and role) and assigning workers to flocks. A user's name can be changed later from the row's <strong>edit</strong> action, and the <strong>password</strong> action sets a forgotten password without needing the old one. The <strong>role</strong> action promotes or demotes an existing user among the five roles — it refuses targeting your own sign-in, and refuses demoting the account's last Admin (owner), so the farm can never lock itself out of user administration. Creating any sign-in, resetting any user's password, and changing any user's role asks the signed-in Admin (owner) to re-enter their current password. A role change signs the affected sign-in out everywhere on its next request, the same way a password reset does. Controls you can't use are hidden, and the server refuses them regardless.","rolesDisableUser":"<strong>Disabling a sign-in</strong> (Users screen, Admin/owner only) cuts off access immediately — every one of that person's open sessions ends on its very next request, the same as a role change or password reset. A reason is optional, and either way it lands in the audit log. <strong>Re-enable</strong> restores their ability to sign in, but never revives the sessions the disable ended — they sign in fresh with their existing password. You can't disable your own sign-in, and you can't disable the account's last Admin (owner).","rolesChangeEmail":"Owners can replace a user's <strong>login email</strong> immediately from the Users screen. The new address is used at the next sign-in, every open session ends, and no confirmation email is sent. Changing your own address requires another active Owner so the farm cannot lose its last working Owner.","ownPassword":"<strong>Your own password.</strong> Anyone, in any role, can change their own password on the <strong>Account</strong> screen by entering the current one and a new one (at least 12 characters). Changing your own password keeps this device signed in with fresh credentials and ends every <em>other</em> open session on its next request. If an admin sets your password instead, every one of your open sessions ends on its next request.","dialogsHeading":"Adding & correcting","dialogsPopup":"Adding and correcting happen in a popup. Look for the <strong>New …</strong> button beside the screen's title — new grade, product, customer, flock, item, user, order. Each row's <strong>edit</strong> or <strong>correct</strong> link opens the same popup with that row's values already filled in.","dialogsDrillDowns":"Drill-downs work the same way. Open a flock's <strong>birds</strong> ledger to record a cull, an inventory item to record a purchase, feed usage, or a stock correction, an order to <strong>record a payment</strong>, or a worker's <strong>flocks</strong> to manage their access — the ledger stays where it is and the form comes to you.","dialogsCancel":"<strong>Cancel</strong>, Escape, or a click outside closes the popup, records nothing, and clears what you typed — reopen it and you start from a blank form. If a save fails, the popup stays open with your values and the reason, so you can fix it and try again — retrying is safe, it never records the same thing twice.","dialogsModal":"While a popup is open the page behind it <strong>waits</strong>: clicks, the Tab key and a screen reader all stay inside the form, so nothing behind it can be changed by accident, and Escape closes the popup you are working in.","dialogsInlineForms":"The screens whose whole job is capture keep their form on the page: <strong>Daily entry</strong>, <strong>Water</strong>, recording an expense, and adding lines to a draft order. Those you use every day — no extra click.","dialogsSteppers":"Whole-number counts — egg counts, bird counts, sale quantities, eggs per unit — have thumb-sized <strong>−</strong> and <strong>+</strong> buttons: tap for one, <strong>hold</strong> to speed up. A sale line's quantity never steps below 1, and it is always a <strong>whole number</strong> — stepped or typed. Decimals belong in prices, which are typed.","dialogsConfirm":"<strong>Actions that cannot be undone ask first.</strong> Submitting a day, confirming or cancelling an order, depleting or archiving a flock — each one says what is about to happen and waits. The keyboard starts on <strong>Cancel</strong>, so pressing Enter by habit never goes through with it. A <strong>red</strong> button means the action undoes or retires something: voiding, cancelling a draft, depleting, archiving. Submitting a day and confirming an order cannot be taken back either, but they are the normal way through the week.","dialogsVoidReason":"<strong>Voids need a reason.</strong> Voiding a daily entry, a payment, or a confirmed order asks the same way but wants a written reason first — it is stored with the void and shown wherever that record turns up afterwards, so write what actually happened. Leave it empty and the popup says so on the spot, keeping whatever you typed.","dailyEntryHeading":"Daily entry","dailyEntryDefaultFlock":"The screen opens on the flock you last recorded against — Daily entry and Water share that memory, per farm, on this device. With nothing remembered it opens on the first active flock; a depleted one is selected by default only when the farm has no active flock — the picker still offers them either way.","dailyEntryPanes":"Pick the flock and date at the top, then work through two panes side by side: <strong>1 Egg counts</strong> (total, cracked, dirty, discarded, deaths) and <strong>2 Grading</strong>. The counts produce a <strong>sellable</strong> figure, and that is the number the grades have to add up to. A draft can leave that partly done, or not started at all — submitting needs it exact.","dailyEntryGradingDown":"Grading counts <strong>down</strong>. Beside the grades is how many sellable eggs you still have to place; it turns green the moment the day adds up and red if you go over — going over blocks saving the draft too, not just Submit. You cannot submit until it reads exactly zero — grading a day partway, or not at all, is fine for a draft but not for Submit.","dailyEntryButtons":"Every count has <strong>−</strong> and <strong>+</strong> buttons. Tap for one, or <strong>hold</strong> — it speeds up as you go, so a few hundred eggs takes about a second. Easier than a keypad with gloves on. A grade's <strong>+</strong> no longer stops at the day's current total — count the grades first and the total catches up to match. It only ever raises the total, never lowers it, so trimming the total on step 1 never pushes a grade back down. Farms that count by the tray can make each tap count a whole pack unit instead of one egg — the farm default lives in <strong>Settings</strong>, and each person can pick their own on their <strong>Account</strong> screen. When a pack unit is in force the buttons say so themselves (<strong>−30 / +30</strong>) and a note above the panes names the unit; typing still enters exact numbers.","dailyEntryPutAllIn":"Most days end the same way — one grade takes whatever is left. <strong>Put all in…</strong> beside the remaining count does it in one move: drag it onto a grade, or tap it and pick one.","dailyEntrySaveBar":"Both save buttons stay in a bar at the bottom of the screen as you scroll. On a phone that bar also shows the sellable count and how many are left, so you never lose sight of whether the day adds up.","dailyEntrySaveSubmit":"<strong>Save draft</strong> keeps the day editable. <strong>Submit</strong> makes it official: it creates the day's egg lots and records deaths in the flock's bird ledger. Workers can no longer edit it — an admin can adjust or void it (see \"Fixing mistakes\").","dailyEntryLocking":"Submitted entries <strong>lock automatically after 7 days</strong>. Locked only means the correction window for routine fixes has passed — admin adjust/void still works on locked entries.","dailyEntryToday":"\"Today\" means <strong>your farm's today</strong>, not the clock in some other part of the world. You can record any day up to and including it; a day that has not happened yet on the farm is refused — here and everywhere else you enter a date: feed and water use, feed purchases and stock corrections, expenses, payments, and a flock's placement date. The same date decides when eggs come out of a withdrawal period, which eggs a sale can take, the day a flock is depleted or archived on, and the range reports open on — so nothing disagrees about what day it is.","dailyEntryOnePerDay":"One entry per flock per day. Reopening a day that has a draft loads it for editing and shows an <strong>Editing draft</strong> badge beside the title, so picking up saved work never looks like starting fresh. If prefill fails, saving is blocked until it succeeds so an existing draft is never silently overwritten.","dailyEntryDepletedBackfill":"Depleted flocks accept backfilled entries up to their depletion date; archived flocks accept none.","flocksHeading":"Flocks & birds","flocksCurrentBirds":"A flock's <strong>current birds</strong> = its starting count minus everything in its <strong>bird ledger</strong>: deaths (added automatically when entries are submitted), <strong>culls</strong> (birds deliberately removed — sold, slaughtered, given away), and manual <strong>adjustments</strong> (count corrections, either direction).","flocksLifecycle":"Lifecycle: <strong>Active</strong> (normal) → <strong>Depleted</strong> (birds gone; history stays, backfill allowed) → <strong>Archived</strong> (hidden from daily work). Depleting and archiving ask for confirmation; both are reversible with <strong>Reactivate</strong>.","flocksPermissions":"Owner and Manager create flocks. Everyone can view the flocks they're permitted to see and their bird ledgers. Editing a flock, lifecycle changes, and recording culls/adjustments are admin-only.","gradesHeading":"Egg grades","gradesBuckets":"Grades are your farm's grading buckets — sizes (Large…), qualities (Cracked…), or custom. Only <strong>saleable</strong> grades appear in entry capture and on orders; non-saleable buckets are bookkeeping.","gradesDeactivating":"Grades are never deleted. <strong>Deactivating</strong> removes a grade from capture and order pickers: its stock stays counted and order lines added earlier can still confirm, but it can't be put on <em>new</em> order lines — reactivate the grade to sell remaining stock. History keeps showing its name.","gradesAdminOnly":"The grade catalog is configuration — managing it is admin-only.","productsHeading":"Products (admin)","productsWhatYouSell":"Products are what you sell — \"Large Eggs by the dozen\", \"Mixed carton\". Each egg product points at an egg grade (that's where its stock comes from) and carries a selling unit and an optional default price. Only egg products exist for now.","productsPackedUnits":"<strong>Packed units</strong> set how many eggs each unit holds — your carton might be 12, 18, or 30. Changing a unit only affects future sales; past orders keep the count they were sold with.","stockHeading":"Stock","stockLots":"Every grade expands into its <strong>lots</strong> (one per submitted day), and every lot into its <strong>movement ledger</strong> — an explicit line for each production, sale, correction, or void. The running sum always equals the balance shown; nothing changes stock without leaving a line. The lot list shows the newest 50 at a time — narrow it with the <strong>From/To</strong> dates to reach an older lot, or keep loading more.","stockRestricted":"Stock is the sum of your egg lots per grade. The <strong>restricted</strong> column is reserved for medication withholding periods — that feature arrives with medication tracking. <strong>Nothing marks eggs restricted yet, so the system does not enforce withdrawal times today</strong> — manage withholding periods outside Cluckwork for now.","stockFifo":"Selling always takes the oldest lots first, so stock naturally rotates.","stockWriteOff":"Lost stock — breakage, spoilage, eggs used by the household — is recorded with <strong>write off</strong> on the lot (Owner/Manager, reason required). It lowers the lot's available count without touching the day's production figures; a recount can also add eggs back, up to what was previously written off. If the recount says the day's <em>laying</em> was wrong, adjust the daily entry instead.","inventoryHeading":"Feed & inventory","inventoryItems":"<strong>Items</strong> define what you track (feed, supplements…) and the unit it's measured in. The unit locks once stock has been received — quantities on record must keep meaning what they meant.","inventoryPurchaseUsage":"<strong>Record purchase</strong> books received stock as a dated lot with its cost. Feeding a flock is recorded on the <strong>Feed page</strong> — a feedable item's panel links straight there with the item preselected.","inventoryLedger":"Every change lands in the item's <strong>movement ledger</strong> — purchases, usage, corrections. Ledger rows are never edited or deleted.","inventoryCorrections":"Typos and spoilage are fixed with <strong>corrections</strong>: an <em>Adjustment</em> (either direction) or a <em>Discard</em> (write-off) against a specific lot, always with a reason. The original row and the correction both stay visible.","inventoryPermissions":"Recording purchases and usage is open to everyone; the item catalog and stock corrections are admin-only.","feedHeading":"Feed","feedRecording":"<strong>Record feed</strong> logs what a flock ate on a day: pick the flock, the item (current stock shows right in the picker), the amount, and the date. Stock drains from the oldest purchases first — only lots that existed on that date — and the cost estimate comes from the actual lots consumed. The page's history lists every feeding with its estimated cost.","feedCorrecting":"Feed records are <strong>never edited</strong>: the stock they drew is already in the ledger, so a mis-entry is fixed with an Inventory <strong>adjustment</strong> on the affected lot (reason required), which stays visible beside the original.","feedDailyEntry":"The <strong>Daily Entry</strong> page shows the selected flock and day's feed and water at a glance, linking here. A feed or water record made while that day's entry already exists also remembers that entry — records made before it stay unlinked on purpose; the day itself is what ties them together.","waterHeading":"Water","waterRecording":"Record what each flock drank per day: either a direct amount (liters or gallons) or <strong>meter readings</strong> — the amount is then the meter delta (end − start).","waterCorrecting":"Water records have no stock behind them, so mistakes are fixed by <strong>correcting the record directly</strong> (the \"correct\" button, admin-only) — no compensating entries. The flock and date are fixed: picked wrong, record it again under the right one.","waterLifecycle":"Same lifecycle rule as everywhere: depleted flocks accept backfill up to their depletion date, archived flocks accept nothing.","salesHeading":"Customers & sales","salesCustomerEdit":"A customer's details (name, phone, email, address, note) can be edited at any time from the Customers page.","salesCustomerLink":"A customer's name on the Customers page and on the dashboard is a link into Sales, filtered to that customer's orders.","salesDrafts":"Orders start as <strong>drafts</strong>: add lines by picking a <strong>product</strong>, a packed unit (dozen, carton, …), a whole-number quantity, and a price per unit (prefilled from the product's default, decimals allowed) — edit freely, or <strong>cancel</strong> (the draft is kept, read-only). The quantity counts <strong>units, not eggs</strong> — the field is labeled with the unit and shows the resulting egg count while you type (2 trays = 60 eggs, not 60 trays). Each line remembers how many eggs its unit held when it was added, so redefining a carton later never changes old orders. Choose <strong>close</strong> while an order loads to keep the panel closed; choose <strong>open</strong> again to view it. When an order refreshes, editing ends if it is no longer a draft or the line is gone. Unedited inputs follow the refreshed line. If you have unsaved inputs and the fetched quantity or price changed, your inputs stay visible and save is blocked. Choose <strong>reload line</strong> to replace both inputs with the latest fetched values. Changes made after the last fetch are not detected here.","salesListPrice":"Each line also shows its <strong>List price</strong> — the product's price when the line was added — next to a <strong>Discount</strong> worked out from it: an amount and a percent when sold under list, <strong>Above list</strong> when sold over, and \"No list price\" when there is nothing comparable to measure against. A line taken before the farm started keeping list prices says \"List price not recorded\" instead — that one means nobody can tell whether it was discounted. A line sold under list is marked three ways so it survives a greyscale print: a <strong>Below list</strong> tag beside the product, its List price struck through, and a tinted row. The order's <strong>Discount</strong> is totalled directly above the order total, as an amount and a percent of list; where part of the order has no list price, the total says so rather than pretending to cover it. The Orders list carries the same figure in its own <strong>Discount</strong> column, so a discounted order is visible without opening it — and an order every line of which was taken before list prices were recorded reads \"List price not recorded\" there, never zero.","salesConfirming":"<strong>Confirming</strong> an order allocates real stock — oldest lots first — and is the point where inventory changes hands.","salesDiscountCeiling":"Your farm can cap how much of a discount you may give. When it does, the Sales screen says so and a line over the cap carries an <strong>Over maximum</strong> tag, with <strong>Confirm order</strong> disabled until the line is repriced. The order stays a draft — nothing is queued and nobody is notified, so ask an owner or manager, who can confirm it untouched. Owners and managers are never capped. Only an owner sets the cap in Farm settings as <strong>Maximum discount</strong>.","salesVoiding":"A mistaken confirm is undone with <strong>Void</strong> (admin-only, reason required): the eggs go back to the exact lots they came from, and the order stays listed as Voided. Voiding is for mistakes, not for returns of delivered goods. (Orders confirmed before lot-level allocation tracking existed can't self-serve void — ask your administrator.)","salesPayments":"<strong>Payments</strong> (Sales, Manager, or admin — voiding a payment is admin/manager only): a confirmed order's panel shows its settlement history — record partial payments (date, amount, method, optional reference) until the outstanding amount reaches zero; overpaying is refused. A wrong payment is <strong>voided</strong> (reason required) and the outstanding grows back. An order with payments can't be voided until its payments are voided first. The Customers page shows each customer's outstanding balance, and the Orders list carries an <strong>Outstanding</strong> column per order, with an <strong>Unpaid only</strong> tick box that narrows the whole list — not just the rows on screen — to the orders still owing something.","reportsHeading":"Reports","reportsProduction":"<strong>Production</strong> (everyone): pick a date range — per-day eggs, losses, sellable, condition, deaths, and <strong>hen-day %</strong>, with period totals and a by-grade breakdown. Draft and voided entries don't count. Hen-day % is eggs collected ÷ hen-days × 100, and it divides by the hen-days of the <strong>flocks that recorded that day</strong> — a flock that filed nothing produced no eggs this report can see, so counting its birds would report a lay rate nothing supports. The <strong>Hen-days</strong> column is every bird alive, recorded or not, so the gap between the two is what is missing. A day nobody recorded shows — rather than 0%.","reportsCondition":"<strong>Condition</strong>: cracked and dirty eggs that became stock instead of being written off. They are counted in <strong>Egg counts</strong>, never graded by hand, so they are not part of <strong>Sellable</strong> — add the two together for everything the day produced that you can sell. A day shows 0 here if you have those grades switched off in Settings, and days recorded before you switched them on keep showing 0 — turning a grade on never rewrites a past day.","reportsMoney":"<strong>Money</strong> (admin): sales summary for the range's orders (revenue / paid / outstanding), expenses by category, and <strong>basic profit</strong> — confirmed revenue minus recorded expenses, no cost-of-goods.","reportsThrottle":"<strong>If a report is refused</strong>: the farm runs only a few reports at a time, so one busy screen cannot slow the app for everyone else. Asking for several at once — a few people opening Reports together, or repeated retries — can come back as <strong>try again shortly</strong> instead of a table. Nothing was recorded and nothing was lost: press <strong>retry</strong> on the Reports screen a moment later and it re-runs with the same dates you picked.","expensesHeading":"Expenses (admin)","expensesRecording":"Record money going out: date, category, description, and amount (in the farm's currency), optionally tied to a flock. The date range — the farm's own dates, not a browser clock elsewhere — shows a running total for the period you pick; categories are managed on the same screen (deactivating one hides it from new expenses — recorded ones keep it).","expensesClearingFilters":"The range opens on the current farm month. <strong>Clear filters</strong> beside the controls puts it back there — it is there while rows are still listed, not only when a filter has hidden everything — and when the month itself is empty, <strong>Show all time</strong> widens the view to every period.","expensesCorrections":"Corrections edit the expense in place (<strong>correct</strong> on the row). If someone else corrected it first, the form reloads their values and asks you to re-apply. The currency an expense was recorded in never changes.","expensesAdminOnly":"Expenses are money data, so the whole screen — viewing included — is admin-only, unlike the production screens where workers record.","historyHeading":"History","historyBrowse":"Browse recorded daily entries newest-first, filtered by flock and date range. The status column shows the entry's life: Draft, Submitted, Locked (7+ days old), Adjusted (hover for the reason), or Voided.","historyAdminActions":"Admins correct from here: <strong>adjust</strong> reopens the entry in the same two-step form as Daily entry — same sellable count, same grading chip, same <strong>put all in…</strong> shortcut — with a reason required; <strong>void</strong> undoes the whole entry. Stock and the bird ledger follow automatically.","historyDraftEdit":"Draft rows have an <strong>edit</strong> link (everyone, not just admins) that jumps back to the Daily entry screen with that flock and day loaded — drafts are edited there, not adjusted.","auditHeading":"Audit log (admin)","auditLog":"Every corrective, destructive, or configuration change lands in the audit log automatically: who did it, when (UTC), what it touched, and the reason where one was given. Written together with the change itself — a failed action leaves no trace, a successful one always does — and never editable, by anyone.","auditRecordTypeFilter":"The Audit log's \"Record type\" dropdown does not filter the rows itself — it narrows the \"Action\" dropdown next to it down to only the actions that happen on the type you pick (Flock, Sales order, and so on), so you are not scanning one long list of every action the farm can log. Pick the action from that narrowed list to actually filter the rows. The From and To dates beside them DO filter the rows, over the UTC day shown in the \"When (UTC)\" column.","auditClearingFilters":"<strong>Clear filters</strong> beside those controls resets all four at once. It leaves the record you arrived on: opening the log from a row's Audit history link scopes it to that record, and that scope is not one of the filters.","auditRecordHistory":"Flocks, Egg grades, Daily entry history, Sales and Expenses each carry a History column showing who created the record and when, plus who last changed it if anyone has. It is read from the same audit log, so it needs no extra permission: if you can see the record, you can see its history.","auditRecordHistoryLink":"That column is a summary, not the whole story. Flocks, Egg grades, Daily entry history, Sales orders, and Expenses each carry an \"Audit history\" link on their own screen that opens the full trail for that one record — every corrective or configuration change, not just the creation and the most recent one — without hunting through the global Audit log above and filtering it yourself. Egg lots carry a similar \"Adjustment history\" link instead — narrower on purpose: only manual write-offs and recounts are recorded against a lot itself, so this shows those, not the lot's full story.","auditRecordHistorySubmit":"Saving a daily entry and submitting it is one act, not a change: do both yourself and the History column names you as the creator with no change against you. If somebody else submits your draft, their submit shows as the last change, so you can always see who made a day's numbers official. Either way the History column tells you WHEN it was submitted, since that is when the eggs entered stock. Confirming a sales order works the same way, and shows when stock was allocated. Correcting an entry after it is locked always shows, even if you created it, and so does cancelling your own draft order. Editing your own draft before submitting it stays hidden — that is just writing it. But if somebody else edits your draft, their change is shown, so the person whose numbers went into stock is never invisible. And once they have, your own later edits are shown too: if you put the numbers back the way you wanted them, the column names you and the time you did it, not the edit you overwrote.","auditSystemActors":"A few entries are made by the system rather than by a person, and show a name in brackets instead of an email. \"(bootstrap-admin)\" is the command that created your very first owner account, before anyone existed to do it. \"(break-glass)\" is the emergency command that resets a password when everyone is locked out — that entry also records which machine it was run from and the reason given, so an emergency reset is never anonymous. \"(suspend-account)\" and \"(reactivate-account)\" are the commands an operator runs to take the whole farm offline and bring it back; those entries record the machine they were run from and the reason given too. \"(provision-account)\" creates a new farm and its first Owner before anyone on that farm can sign in. \"(rename-account)\" is the command an operator runs to change your farm's code; that entry records the old and new codes, the machine it was run from and the reason given. Everything else names the person who did it.","auditRecordHistoryOlder":"Records created before this was added show no \"created by\" line — there is simply no creation entry in the log for them, and none is invented after the fact. If such a record has been changed since, that change still shows; the History column is empty only when there is nothing at all.","exportHeading":"Export & backup (admin)","exportCsv":"The Export screen downloads your data as CSV files you can open in any spreadsheet — one dataset at a time, or everything at once as a zip (the <strong>full backup</strong>, with a manifest of row counts). Keep a copy somewhere safe on your own schedule; automatic scheduled backups come in a later phase.","exportFormats":"Money columns hold minor units (cents) plus the currency — exact values, not display formatting. Dates are ISO (YYYY-MM-DD), and timestamps are UTC.","farmSettingsHeading":"Farm settings (owner only)","farmSettingsIntro":"Only an owner can open or change <strong>Setup → Farm settings</strong>. It holds the farm's name and the four things that decide how everything reads: <strong>timezone</strong>, <strong>locale</strong>, <strong>currency</strong> and <strong>unit system</strong>. First day of week and the date and time formats are optional — leave them blank and the locale decides. The timezone takes effect everywhere the moment it is saved; the rest are recorded against the farm and will drive how amounts, dates and measurements are displayed once that formatting lands.","farmSettingsTimezone":"The <strong>timezone</strong> is the farm's day. Every field that records <em>when something happened</em> — daily entry, flocks, water, feed usage, stock purchases, expenses, orders and payments — opens on it and refuses to go past it for what you record, whatever day the phone or laptop in your hand is on, so a device travelling ahead of the farm can no longer offer a date the save then refuses. Dates that are meant to be in the future are not capped: a <strong>stock item's expiry date</strong>.","farmSettingsCurrency":"The <strong>currency</strong> locks the moment the farm records its first amount — a sale, a payment, an expense, a priced product, or money spent on feed. The field shows as locked with the reason rather than letting you type a code that would be refused. Nothing already recorded is ever re-priced, which is exactly why it locks.","farmSettingsLogo":"The <strong>logo</strong> replaces the Cluckwork mark in the sidebar for everyone at the farm. PNG, JPEG or WebP, up to the size limit shown on the screen (2 MB by default) and 4096 pixels a side. Animated images are refused rather than flattened. What gets stored is a rebuilt copy: camera and location details are stripped out on the way in — a photo taken on a phone carries where it was taken, and for a farm that is its address. Remove it and the sidebar goes back to the Cluckwork mark.","farmSettingsDateTimeFormat":"<strong>Date format</strong> and <strong>time format</strong> offer a few common choices in a dropdown — pick one and you are done. Need something not listed? Choose <strong>Custom…</strong> to type your own. Every date in a list — daily entries, egg lots, orders, payments, expenses, feed and water records, reports — is shown through the date format (with none set, the farm locale's own short form), so open any list to see a custom value rendered; the presets are all safe choices. Nothing displays a time through the time format yet, so a broken custom time value would not be visible today.","farmSettingsSquareLogo":"The logo shows in the sidebar at about the height of a line of text. A simple, tightly-cropped mark and a <strong>wide wordmark</strong> both read fine there — a wordmark keeps its own shape and uses the horizontal space rather than being squashed into a square. What does not work at that size is a detailed picture or a busy scene: it shrinks to something unreadable. Give a detailed image to the farm banner instead, where it is shown full-size.","farmSettingsBanner":"The <strong>banner</strong> is a second, independent image shown full-size on a splash screen right after signing in, once per sign-in — a wide or detailed picture works well here, unlike the small sidebar logo above. It has its own size limit (5 MB by default) and its own presence: a farm can have a logo, a banner, both, or neither. If none is set, the splash is skipped entirely.","farmSettingsCountingUnit":"<strong>Daily Entry counting unit</strong> sets how much the entry screen's +/− buttons count by for everyone on the farm — one egg, or a pack unit like Tray (30 per tap). Only units with an active eggs-per-unit definition on the Products screen can be picked, and each person can override it for themselves on their Account screen.","farmSettingsWorkerSaleAllocation":"<strong>Worker sale allocation</strong> controls which egg lots a restricted plain Worker's sale can draw from when confirming an order: assigned flocks only (the default) or all farm flocks. Owner, Manager, and Sales confirmations are always farm-wide, whatever this is set to (Read-only cannot confirm a sale at all).","farmSettingsMaxDiscount":"<strong>Maximum discount</strong> is the largest discount a Sales or Worker user may put on one sale line, as a whole percent of that line's list price. Leave it blank for no limit. <strong>0 is not the same as blank</strong>: it means sales staff may give nothing away at all. Owners and managers are not capped by it and can confirm an order that goes over it.","farmPaletteHeading":"Farm palette","farmPaletteIntro":"Farm settings lets an owner pick the accent colour used across the app for everyone on the farm: Aubergine, Forest, Slate or Terracotta. The choice applies when you save, and everyone sees it the next time their app loads. Each device also remembers the palette for each farm, so a farm's own colour can appear on the sign-in screen before anyone signs in: when you open that farm's link, or when the device remembers exactly one farm. A device that remembers several farms shows the default colour until you sign in, and Forget this farm removes that farm's remembered colour along with its code.","farmPaletteLightNight":"Light and night mode are separate and personal. Each person picks their own with the toggle in the sidebar, on each device, and the farm palette never overrides it — every palette is designed to work in both.","accountHeading":"Your account","accountPassword":"<strong>Change password</strong> needs your current one and signs your other devices out — every role can do this for themselves.","accountLanguage":"<strong>Language</strong> switches the interface just for you, immediately, on every device you sign into.","accountCountingUnit":"<strong>Daily Entry counting unit</strong> — how much YOUR +/− taps count by, overriding the farm default from Settings. Pick a pack unit like Tray to count by the tray, or follow the farm default so a later farm-wide change follows you automatically.","installHeading":"Install on a phone","installIntro":"Cluckwork can be added to a phone or tablet's home screen, where it gets its own icon and opens in its own window without the browser bars — more room for the entry screens and quicker to reach in the shed. It's the same app, not a separate download, so there is nothing to update from an app store.","installSteps":"<strong>Android (Chrome):</strong> open the menu and choose <strong>Install app</strong> or <strong>Add to Home screen</strong>. <strong>iPhone/iPad (Safari):</strong> tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>.","installHttps":"Installing is only offered over a secure (<strong>https</strong>) address. If your farm reaches Cluckwork on a plain <strong>http</strong> one the option simply won't appear — nothing is broken, and the app works exactly as it does in the browser.","installOffline":"Installing does <strong>not</strong> make the app work offline. It still needs a connection to load and save; only the app's own screens are kept on the device so it starts quickly. Recording while offline is planned work, not something installing turns on.","installNewVersion":"When a new version is released you'll see <strong>\"A new version of Cluckwork is ready\"</strong>. It waits for you rather than reloading while you're typing — press <strong>Reload</strong> when you're at a good moment, or <strong>Later</strong> and it will ask again next time. Nothing is lost by leaving it.","mistakesHeading":"Fixing mistakes","mistakesIntro":"Every fix in this table needs an admin sign-in (see \"Who can do what\") — workers record, admins correct. The one exception: a <em>draft</em> is still recording, not correcting, so workers edit their own drafts.","mistakesTableMistakeHeader":"Mistake","mistakesTableFixHeader":"Fix","mistakesRow1Mistake":"Depleted or archived the wrong flock","mistakesRow1Fix":"Flocks → <strong>Reactivate</strong> (fully reversible)","mistakesRow2Mistake":"Wrong bird count","mistakesRow2Fix":"Flocks → bird ledger → <strong>Adjustment</strong> (either direction)","mistakesRow3Mistake":"Confirmed the wrong sales order","mistakesRow3Fix":"Sales → open the order → <strong>Void order</strong> (stock returns to its lots; reason required). If payments were recorded on it, void those first.","mistakesRow4Mistake":"Recorded a wrong payment","mistakesRow4Fix":"Sales → open the order → payments → <strong>void</strong> (reason required): the row is kept and the outstanding amount grows back.","mistakesRow5Mistake":"Wrong <em>quantity</em> in a feed purchase / spoiled feed","mistakesRow5Fix":"Inventory → open the item → <strong>Correct stock</strong> (Adjustment or Discard against the lot; reason required). Only quantities are correctable — a wrong cost, date, or lot number can't be fixed yet, so double-check those before saving.","mistakesRow6Mistake":"Over- or under-recorded feed usage","mistakesRow6Fix":"Same correction form: a positive Adjustment returns over-used stock to the lot (up to what it received); a negative one removes under-recorded stock. The usage record itself and its cost estimate stay as recorded — corrections fix the stock, not the history.","mistakesRow7Mistake":"Wrong water record","mistakesRow7Fix":"Water → <strong>correct</strong> on the record — amounts, source, meters, and note edit in place (no stock behind water). Flock and date are fixed: picked wrong, record it again under the right one.","mistakesRow8Mistake":"Wrong numbers in a <em>submitted</em> daily entry","mistakesRow8Fix":"History → <strong>adjust</strong> (admin) — totals, losses, mortality, and grade split, with a required reason. The corrected grades must add up to the corrected sellable count exactly, the same rule Submit uses, and <strong>Save adjustment</strong> is blocked until they do. Stock and the bird ledger update to match automatically, but eggs already sold can never be un-counted: shrinking a grade below what was sold is refused. The previous values stay visible on the entry.","mistakesRow9Mistake":"Entire <em>submitted</em> entry is wrong (wrong flock or day)","mistakesRow9Fix":"History → <strong>void</strong> (admin, reason required): its egg lots empty, its deaths are reversed in the bird ledger, and the entry is kept as Voided. Refused if any of its eggs were already sold — void the sale first. Voiding frees the day: the correct entry can then be recorded for the same flock and date.","mistakesRow10Mistake":"Mistake in a <em>draft</em> entry or order","mistakesRow10Fix":"Edit it — draft numbers, grade lines, and order lines are all editable (draft entries: History → <strong>edit</strong> jumps to the Daily entry screen with the day loaded). The flock/date of an entry and the customer/date of an order are fixed, though: picked wrong, just record it again under the right one (and cancel the wrong draft order).","glossaryHeading":"Glossary","glossaryNavigationTerm":"Navigation","glossaryNavigationDef":"Screens live in the left sidebar on a computer; on a phone the four you use most are tabs across the bottom, the rest under More.","glossaryPageLoadingTerm":"Page loading","glossaryPageLoadingDef":"The brief message shown while Cluckwork opens a screen that has not loaded yet. Navigation remains available, and the message disappears when the screen is ready.","glossarySearchablePickerTerm":"Searchable picker","glossarySearchablePickerDef":"The type-to-search control used for flock and customer name fields. Typing explores results without changing your current choice; press <strong>Enter</strong> or click a result to pick it, or <strong>Escape</strong> to cancel and keep the previous choice. <strong>Load more</strong> fetches further results, and <strong>Retry</strong> repeats a failed search or Load more. A remembered or linked name that can no longer be found shows as <strong>Unavailable</strong>.","glossaryOperationalDayTerm":"Operational day","glossaryOperationalDayDef":"Dates mean your farm's calendar day, worked out from the farm's own timezone rather than a clock somewhere else. It is the same \"today\" everywhere: what counts as a future date when you record work, when eggs leave a withdrawal period, which eggs a sale can take, the day a flock is depleted or archived on, and the range reports open on. Every field that records WHEN SOMETHING HAPPENED opens on it and will not go past it, whatever day the device in your hand is on. Dates meant to fall in the future are not capped — a stock item's expiry date.","glossaryInstallToHomeScreenTerm":"Install to home screen","glossaryInstallToHomeScreenDef":"Adding Cluckwork to a phone or tablet's home screen from the browser, so it gets its own icon and opens in its own window without the browser bars. It is the same app, not a separate download — nothing to update from an app store. Only offered over a secure (https) address, and it does <strong>not</strong> make the app work offline: it still needs a connection to load and save.","glossaryNewVersionReadyTerm":"A new version is ready","glossaryNewVersionReadyDef":"After a release, an installed app notices the new version in the background and asks before switching, rather than reloading while you are typing. Press Reload when convenient, or Later and it asks again next time. Nothing is lost by leaving it — the running app keeps working until you accept.","glossaryFarmCodeTerm":"Farm code","glossaryFarmCodeDef":"The short code that names your farm on the sign-in screen. You type it before your email, because the same email address can exist in several farms and only the code says which one you mean. It is lowercase. It rarely changes, but an operator can change it on request — after that you sign in with the new code. The sign-in screen remembers the last 10 farms you have signed in with on this device, most recent first, and offers each one — even when there is only a single remembered farm — in a picker so you usually do not have to retype the code. Each entry can be forgotten individually with its Forget control, after a confirmation; that removes only that farm from this device and does not clear your language or theme or any other preference. A link such as /login?farm=<code> takes over and fills the code in for you, without showing the list. If you do not know your farm's code, ask your administrator — they can look it up.","glossaryLoginEmailTerm":"Login email","glossaryLoginEmailDef":"The address used with a farm code to sign in. An Owner can replace it immediately on the Users screen; the old address stops working, open sessions end, and no confirmation email is sent.","glossaryFarmProvisioningTerm":"Farm provisioning","glossaryFarmProvisioningDef":"The operator-only command that creates a new farm, its default egg grades and packed-unit conversions, and its first Owner in one transaction. The farm starts in UTC; after the Owner replaces the one-time password at first sign-in, they select its IANA timezone in Settings. It runs outside the app; farm users do not invoke it.","glossaryTooManySignInAttemptsTerm":"Too many sign-in attempts","glossaryTooManySignInAttemptsDef":"Sign-in is rate limited to slow password guessing: too many attempts from one place in a few minutes are refused with this message until a short cool-off passes. It never affects an already signed-in session.","glossaryForcedReauthTerm":"Several farms in one browser","glossaryForcedReauthDef":"Each farm has a separate secure session cookie, so one farm cannot overwrite or clear another farm's session. A tab remembers its chosen farm across reloads. When a tab with no remembered farm finds several sessions, it returns to sign-in rather than guessing; choose the farm code you want.","glossaryTooManyReportsTerm":"Too many reports at once","glossaryTooManyReportsDef":"The farm runs only a few reports at the same time, so one busy screen cannot slow the app for everyone. Over that, a report comes back asking you to try again shortly instead of waiting in line. Nothing is recorded or lost — press retry on the Reports screen a moment later; it re-runs with the same dates you picked. Each farm has its own allowance, so another farm's reports never use up yours.","glossaryStepUpAuthTerm":"Step-up authentication","glossaryStepUpAuthDef":"An extra check on top of being signed in: before creating any user, resetting any user's password, changing any user's role, changing a login email, disabling a user, re-enabling a user, assigning a worker to a flock, or removing a worker's flock assignment, the Users screen asks you to re-enter your current password right there in the dialog. It confirms it's really you before handing out — or taking away — access. Display-name changes do not ask again.","glossarySomethingWentWrongScreenTerm":"\"Something went wrong\" screen","glossarySomethingWentWrongScreenDef":"What a screen shows when it hits an error, instead of going blank. Saved data is safe — anything you were still typing may need re-entering; tap Reload or Back to the dashboard. \"Error details\" holds the message for a screenshot.","glossaryDailyEntryTerm":"Daily entry","glossaryDailyEntryDef":"One flock's day: eggs by grade, losses, deaths. Grading past the total raises it to match. Draft until submitted.","glossaryCaptureStatusTerm":"Capture status","glossaryCaptureStatusDef":"Whether each active flock has a daily entry for today. The dashboard shows it as one tile per flock, missing ones first; \"No entry\" is the alarm state and links to Daily entry for that flock and day.","glossaryEggLotTerm":"Egg lot","glossaryEggLotDef":"A dated batch of sellable eggs of one grade, created by submitting an entry. Stock is the sum of lots.","glossaryGradeTerm":"Grade","glossaryGradeDef":"A grading bucket (size, quality, or custom). Saleable grades can be sold.","glossaryEggMovementLedgerTerm":"Egg movement ledger","glossaryEggMovementLedgerDef":"The line-by-line history behind an egg lot's balance: production in, sales out, corrections and voids signed accordingly.","glossaryStockWriteOffTerm":"Stock write-off","glossaryStockWriteOffDef":"An Owner/Manager correction that removes lost eggs from a lot (breakage, spoilage, internal use) or applies a recount, with a required reason. It changes only the lot's available count — the day's production figures stay untouched. A recount can add eggs back up to what was previously written off.","glossaryFifoTerm":"FIFO","glossaryFifoDef":"\"First in, first out\" — sales and feed usage always take the oldest stock first.","glossaryWorkerSaleAllocationTerm":"Worker sale allocation","glossaryWorkerSaleAllocationDef":"The farm setting deciding whether a restricted plain Worker's sale confirmation draws only from their assigned flocks (the default) or from the whole farm.","glossaryCullTerm":"Cull","glossaryCullDef":"Birds deliberately removed from a flock (sold, slaughtered, given away) — not deaths.","glossaryMortalityTerm":"Mortality","glossaryMortalityDef":"Deaths, recorded on the daily entry; lands in the bird ledger automatically at submit.","glossaryDepleteTerm":"Deplete","glossaryDepleteDef":"Mark a flock as having no birds left. History stays; reversible via Reactivate.","glossaryArchiveTerm":"Archive","glossaryArchiveDef":"Hide a finished flock from daily work. Reversible via Reactivate.","glossaryWithdrawalRestrictionTerm":"Withdrawal restriction","glossaryWithdrawalRestrictionDef":"A hold on eggs during a medication withholding period. Coming with medication tracking — nothing sets restrictions yet, so manage withholding periods outside Cluckwork for now.","glossaryProductTerm":"Product","glossaryProductDef":"What you sell — an egg product points at a grade (its stock source) and carries a selling unit and default price.","glossaryPackedUnitTerm":"Packed unit","glossaryPackedUnitDef":"How many eggs a dozen/tray/carton/case holds on your farm. Each sale line keeps the count it was sold with.","glossaryCountingUnitTerm":"Counting unit","glossaryCountingUnitDef":"How much each tap of the Daily Entry − / + buttons counts — one egg, or a packed unit like a tray. Farm default in Settings; your own pick on your Account screen. The buttons show the amount (−30 / +30) when it isn't one.","glossarySalesLineTerm":"Sales line","glossarySalesLineDef":"One product on an order: a whole-number quantity in selling units, priced per unit (the price may have decimals); the eggs behind it are quantity × the unit's egg count. When an order refreshes, editing ends if it is no longer a draft or the line is gone. Unedited inputs follow the refreshed line. If you have unsaved inputs and the fetched quantity or price changed, your inputs stay visible and save is blocked. Choose reload line to replace both inputs with the latest fetched values. Changes made after the last fetch are not detected here.","glossaryConfirmOrderTerm":"Confirm (order)","glossaryConfirmOrderDef":"Turns a draft order into a real sale and allocates stock. Undone only by voiding.","glossaryVoidOrderTerm":"Void (order)","glossaryVoidOrderDef":"Undo of a mistaken confirm — stock returns to the exact lots it came from. Needs a reason.","glossaryCancelOrderTerm":"Cancel (order)","glossaryCancelOrderDef":"Close a draft that never happened. No stock involved. The close link only hides the panel; use open to view it again.","glossaryListPriceTerm":"List price","glossaryListPriceDef":"The product's price at the moment a line was added, kept with the line so a later price change never rewrites a past order. Shown as \"No list price\" when there is nothing comparable to measure against — a recorded fact. A line taken before the farm started keeping list prices shows \"List price not recorded\" instead: that one is missing information, not an answer, so nobody can say whether the line was discounted.","glossaryDiscountTerm":"Discount","glossaryDiscountDef":"How much a sale line sold under its own list price, shown per line — and summed for the whole order, as an amount and a percent of the list value of the lines that have a list price. An order that has lines but no list price on any of them says so rather than reading as zero — and when every one of those lines was taken before the farm started keeping list prices, it says the order predates that record. One line that simply had no list price is enough to rule that out. An order with no lines at all has nothing to measure and reads as a dash in the Orders list, with no discount line on the order itself. Different from the order-level discount a seller can type in — this one is worked out for you, never entered.","glossaryDiscountReasonTerm":"Discount reason","glossaryDiscountReasonDef":"Why an order was allowed to sell below list price: Volume, Damaged stock, Long-standing customer, Manager approved, or Other. Asked for when you confirm an order that has a line priced under list, and only then — an order sold at or above list takes no reason. Other needs a note; the rest take one if you want to add it. An order confirmed before this existed carries no reason, which means it was not recorded, not that nothing was given away.","glossaryDiscountCeilingTerm":"Discount ceiling","glossaryDiscountCeilingDef":"The largest discount a Sales or Worker user may put on one sale line. An owner sets it in Farm settings as Maximum discount. An owner or manager can confirm an order that goes over it. A line over the ceiling is marked Over maximum, and Confirm order stays blocked until the line is repriced or an owner or manager confirms the order untouched. A farm with no ceiling set behaves exactly as before, and a ceiling of 0 is not the same as none — it means nothing may be given away at all.","glossaryAboveListTerm":"Above list","glossaryAboveListDef":"A line sold for more than its own list price.","glossaryOutstandingTerm":"Outstanding","glossaryOutstandingDef":"What a confirmed order still owes: its total less every payment that has not been voided. The Orders list shows it in its own Outstanding column, and Unpaid only narrows the list to the orders still owing something — a part-paid order counts as unpaid, because it is. A settled order reads Settled rather than a zero. Draft, cancelled and voided orders show a dash instead: payments attach to confirmed orders only, so they have no amount outstanding to speak of. Voiding a payment makes the outstanding amount grow back. Only Sales, Manager and owner users see this column.","glossaryInventoryItemTerm":"Inventory item","glossaryInventoryItemDef":"A catalog entry for something you stock (feed, supplements…), with a fixed unit of measure.","glossaryInventoryLotTerm":"Inventory lot","glossaryInventoryLotDef":"One received batch of an item, with its own cost. On-hand = sum of lots.","glossaryInventoryMovementLedgerTerm":"Inventory movement ledger","glossaryInventoryMovementLedgerDef":"The append-only trail of every feed/supply stock change. Corrections are new rows, never edits.","glossaryWaterUsageTerm":"Water usage","glossaryWaterUsageDef":"What a flock drank on a day — direct amount or meter delta. Editable in place; flock/date fixed.","glossaryFeedUsageTerm":"Feed usage","glossaryFeedUsageDef":"What a flock ate on a day; drains lots FIFO and estimates cost from them.","glossaryAdjustmentDiscardTerm":"Adjustment / Discard","glossaryAdjustmentDiscardDef":"Stock corrections against a lot, reason required. Discard = write-off (spoilage).","glossaryRolesTerm":"Roles","glossaryRolesDef":"Admin (owner), Manager, Worker, Sales, Read-only — see \"Who can do what\". Workers record; managers also correct and manage operational catalogs; owners manage Farm settings, branding, and users; sales handles orders and payments; read-only just views.","glossaryFlockScopingTerm":"Flock scoping","glossaryFlockScopingDef":"A Worker's reads are limited to their assigned flocks plus farm-wide rows. Owner and Manager are unrestricted. Workers with no assignment rows, or a farm-wide row, are unrestricted too. An unassigned flock's detail returns 404. Creating a flock is always Owner/Manager, regardless of scope.","glossaryLockedEntryTerm":"Locked (entry)","glossaryLockedEntryDef":"A submitted entry older than 7 days — closed to routine edits; admin adjust/void still works.","glossaryAdjustEntryTerm":"Adjust (entry)","glossaryAdjustEntryDef":"Admin correction of a submitted entry. The corrected grades must add up to the corrected sellable count exactly, the same rule Submit uses — an adjustment has no draft state to leave partly graded. Stock and bird ledger reconcile automatically; sold eggs are untouchable; previous values stay visible.","glossaryVoidEntryTerm":"Void (entry)","glossaryVoidEntryDef":"Admin undo of a whole submitted entry — lots empty, deaths reverse, entry preserved as Voided. Refused once its eggs are sold.","glossaryFarmSettingsTerm":"Farm settings","glossaryFarmSettingsDef":"The farm's name, timezone, locale, currency and unit system, plus optional first day of week and date/time formats — picked from a preset dropdown, or typed as a custom .NET format string. Only owners open and edit Setup → Farm settings. Every authenticated role reads the formatting and branding values through the farm account response.","glossaryCurrencyLockTerm":"Currency lock","glossaryCurrencyLockDef":"The farm currency stops being editable once anything has recorded an amount in it — a sale, a payment, an expense, a priced product, money spent on feed. The field shows locked with the reason. Nothing already recorded is ever re-priced, which is the whole point.","glossaryFarmLogoTerm":"Farm logo","glossaryFarmLogoDef":"Your own image in place of the Cluckwork mark in the sidebar, uploaded from Farm settings. PNG, JPEG or WebP (2 MB by default), still images only; a simple mark or a wide wordmark reads best at that size, while a detailed picture belongs on the farm banner. Stored as a rebuilt copy with camera and location details stripped out.","glossaryFarmBannerTerm":"Farm banner","glossaryFarmBannerDef":"A second, independent image shown full-size on a splash screen right after signing in, once per sign-in. Separate from the farm logo above — a farm can have a logo, a banner, both, or neither. Same PNG/JPEG/WebP still-image rules, its own larger size limit (5 MB by default), uploaded from Farm settings.","glossaryFarmPaletteTerm":"Farm palette","glossaryFarmPaletteDef":"The farm-wide accent colour, chosen by an owner in Farm settings. Separate from each person's own light/night mode setting. Remembered for each farm on each device, so it can appear on the sign-in screen before anyone signs in; a device that remembers several farms shows the default until sign-in.","glossaryUiLanguageTerm":"UI language","glossaryUiLanguageDef":"The per-user language the interface is shown in — English, Español, or Tagalog — chosen from Account → Preferences. English is the fallback for any screen not yet translated, whatever language you picked.","glossaryDisabledUserTerm":"Disabled user","glossaryDisabledUserDef":"Revoked access, not deletion. A disabled user can't sign in, refresh, or get a step-up grant, and every session they had open ends on its very next request. Re-enabling restores sign-in but not those old sessions — anything issued before the disable never works again. The account's last active Admin (owner) can't be disabled, and nobody can disable themselves.","glossaryRepoNote":"Full spec-language definitions live in the repository's <code>specs/product/GLOSSARY.md</code>."}}
;
